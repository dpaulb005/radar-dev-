<title>Radar Bench Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#e8ecf1; --surface:#f8fafc; --surface-2:#eef2f6;
    --ink:#0f151c; --ink-2:#3b4653; --muted:#69757f;
    --rule:#c3ccd6; --hair:#d7dee6;
    --rf:#c2622a; --dsp:#2f77b0; --ok:#22794c; --link:#6a4fbf; --pow:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
      --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
      --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
    --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
    --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr;height:100vh;min-height:640px}
  header{grid-column:1/3;padding:14px 20px 10px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  header .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rf)}
  header .sub{color:var(--ink-2);font-size:13px}
  #vp{position:relative;background:#0a0e13;overflow:hidden}
  #cv{display:block;width:100%;height:100%}
  #hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  button{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:3px}
  button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.grp{border-radius:0} button.grp:first-child{border-radius:3px 0 0 3px} button.grp:last-child{border-radius:0 3px 3px 0}
  .grpwrap{display:flex}
  #tip{position:absolute;pointer-events:none;background:rgba(15,21,28,.92);color:#e6ecf2;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:5px 8px;border-radius:3px;border:1px solid #3a4a5a;white-space:nowrap;opacity:0;transform:translate(-50%,-130%)}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:1px 5px;border-radius:2px;background:rgba(15,21,28,.78);color:#dfe6ee;border:1px solid rgba(255,255,255,.14);white-space:nowrap;opacity:0;transition:opacity .15s}
  .lbl.rf{color:#f0a878;border-color:rgba(240,168,120,.45)} .lbl.dsp{color:#89c2ea;border-color:rgba(137,194,234,.45)} .lbl.ok{color:#7ed6a6;border-color:rgba(126,214,166,.45)} .lbl.pow{color:#f2c86a;border-color:rgba(242,200,106,.45)}
  #status{position:absolute;left:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8593a0}
  aside{background:var(--surface);border-left:1px solid var(--rule);overflow-y:auto;padding:12px 14px 30px}
  aside h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
  aside h2:first-child{margin-top:2px}
  .row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
  .row:hover{background:var(--surface-2)} .row.sel{border-color:var(--rf);background:var(--surface-2)}
  .row .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px}
  .row .q{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px;white-space:nowrap}
  .row.na{opacity:.6;cursor:default} .row small{display:block;color:var(--muted);font-size:11px}
  .total{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);padding:8px 6px;border-top:1px solid var(--rule);margin-top:10px}
  .legend{font-size:12px;color:var(--ink-2);margin:6px 0 0}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  @media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh 1fr} header{grid-column:1} aside{border-left:0;border-top:1px solid var(--rule)}}
</style>

<div id="app">
  <header>
    <div><div class="eyebrow">horn-fed FMCW radar · every BOM row · the breadboard, hole by hole</div><h1>Radar Bench Model</h1></div>
    <div class="sub">Drag to orbit · scroll to zoom · click a BOM row to fly to the part · hover anything for its name.</div>
  </header>
  <section id="vp">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="grpwrap"><button class="grp on" data-stage="1">1 · fixed pair</button><button class="grp" data-stage="2">2 · turntable</button><button class="grp" data-stage="3">3 · stacked RX</button></div>
      <button id="b-bench" class="on">Bench</button><button id="b-bb">Breadboard</button><button id="b-room">Room + drone</button>
      <button id="b-labels" class="on">Labels</button><button id="b-coax" class="on">Coax</button>
    </div>
    <div id="tip"></div>
    <div id="status"></div>
  </section>
  <aside id="bom"></aside>
</div>

<script>
(function(){
// =====================================================================
// setup
// =====================================================================
const cv=document.getElementById('cv'), vp=document.getElementById('vp'), tip=document.getElementById('tip');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0e13); scene.fog=new THREE.Fog(0x0a0e13,4,14);
const camera=new THREE.PerspectiveCamera(40,1,0.01,60);
scene.add(new THREE.HemisphereLight(0xa8bfd2,0x1a2129,0.9));
const key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(1.5,2.6,1.8); scene.add(key);
const rim=new THREE.DirectionalLight(0xe59055,0.3); rim.position.set(-2,1.2,-1.5); scene.add(rim);

const M={
  metal:new THREE.MeshStandardMaterial({color:0xb9c3cc,metalness:.72,roughness:.34,side:THREE.DoubleSide}),
  metalIn:new THREE.MeshStandardMaterial({color:0x6a757f,metalness:.55,roughness:.42,side:THREE.BackSide}),
  alu:new THREE.MeshStandardMaterial({color:0xaab3ba,metalness:.6,roughness:.45}),
  wood:new THREE.MeshStandardMaterial({color:0x9a7c52,roughness:.85}),
  pcb:new THREE.MeshStandardMaterial({color:0x1f5d3a,roughness:.75}),
  pcbBlue:new THREE.MeshStandardMaterial({color:0x1b3f7a,roughness:.75}),
  pcbRed:new THREE.MeshStandardMaterial({color:0x7a1f1f,roughness:.75}),
  dark:new THREE.MeshStandardMaterial({color:0x27313a,metalness:.3,roughness:.6}),
  black:new THREE.MeshStandardMaterial({color:0x111418,roughness:.6}),
  rf:new THREE.MeshStandardMaterial({color:0xc2622a,metalness:.35,roughness:.5}),
  dsp:new THREE.MeshStandardMaterial({color:0x2f77b0,metalness:.3,roughness:.5}),
  ok:new THREE.MeshStandardMaterial({color:0x2c9c68,metalness:.3,roughness:.5}),
  coax:new THREE.MeshStandardMaterial({color:0x30383f,metalness:.4,roughness:.5}),
  coaxRx:new THREE.MeshStandardMaterial({color:0x2a4a6a,metalness:.4,roughness:.5}),
  sma:new THREE.MeshStandardMaterial({color:0xd4b25a,metalness:.8,roughness:.3}),
  bb:new THREE.MeshStandardMaterial({color:0xf2f0e6,roughness:.9}),
  hole:new THREE.MeshStandardMaterial({color:0x3a3a3a,roughness:.9}),
  res:new THREE.MeshStandardMaterial({color:0xd9c39a,roughness:.7}),
  film:new THREE.MeshStandardMaterial({color:0xd8b53a,roughness:.7}),
  cer:new THREE.MeshStandardMaterial({color:0xd08a3a,roughness:.7}),
  elec:new THREE.MeshStandardMaterial({color:0x1d2330,roughness:.6}),
  lead:new THREE.MeshStandardMaterial({color:0xc9ccd0,metalness:.7,roughness:.4}),
  copper:new THREE.MeshStandardMaterial({color:0xb87333,metalness:.7,roughness:.4}),
  screen:new THREE.MeshStandardMaterial({color:0x0b1a2a,emissive:0x0e2a44,roughness:.4}),
  brick:new THREE.MeshStandardMaterial({color:0x2b2f34,roughness:.7}),
  rubber:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.95}),
  glow:new THREE.MeshStandardMaterial({color:0xffc06a,emissive:0xff9a2a,emissiveIntensity:.9,transparent:true,opacity:.85}),
};
const pickables=[], labels=[], registry={};      // registry: bomId -> [meshes]
function reg(id,obj,name,cls){ obj.userData.bom=id; obj.userData.name=name||id; if(cls) obj.userData.cls=cls; (registry[id]=registry[id]||[]).push(obj); obj.traverse(o=>{ if(o.isMesh){ o.userData.bom=id; o.userData.name=obj.userData.name; pickables.push(o);} }); return obj; }
function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); }
function cyl(r,h,mat,seg=16){ return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat); }
function at(m,x,y,z){ m.position.set(x,y,z); return m; }
function addLabel(obj,text,cls,off){ const el=document.createElement('div'); el.className='lbl '+(cls||''); el.textContent=text; vp.appendChild(el); labels.push({el,obj,off:off||new THREE.Vector3(0,.02,0)}); }

// =====================================================================
// the board and the room
// =====================================================================
const BW=0.457, BD=0.381, BT=0.018, TOP=BT;
const world=new THREE.Group(); scene.add(world);
const grid=new THREE.GridHelper(4,20,0x2b3742,0x1a232b); scene.add(grid);
const bench=new THREE.Group(); world.add(bench);
reg('D17', at(box(BW,BT,BD,M.wood),0,BT/2,0), 'plywood board 18" x 15"');
bench.add(registry.D17[0]);

// SMA port helper: small gold cylinder along +axis
function sma(len=0.009){ const g=new THREE.Group(); const b=cyl(0.0032,len,M.sma,12); b.rotation.z=Math.PI/2; b.position.x=len/2; g.add(b); const n=cyl(0.0042,0.004,M.sma,6); n.rotation.z=Math.PI/2; n.position.x=len-0.002; g.add(n); return g; }
function module(w,h,d,mat,ports){ // ports: [{side:'l'|'r'|'b'|'f', y, off}]
  const g=new THREE.Group(); const body=box(w,h,d,mat); body.position.y=h/2; g.add(body); g.userData.ports={};
  (ports||[]).forEach(p=>{ const s=sma(); const y=(p.y!==undefined?p.y:h/2); if(p.side==='r'){ s.position.set(w/2,y,p.off||0);} else if(p.side==='l'){ s.rotation.y=Math.PI; s.position.set(-w/2,y,p.off||0);} else if(p.side==='b'){ s.rotation.y=Math.PI/2; s.position.set(p.off||0,y,-d/2);} else { s.rotation.y=-Math.PI/2; s.position.set(p.off||0,y,d/2);} g.add(s); g.userData.ports[p.name]=s; });
  return g;
}
function portWorld(mod,name){ const s=mod.userData.ports[name]; const v=new THREE.Vector3(0.009,0,0); s.localToWorld(v); return v; }

// --- RF chain, in MIT order, back row of the board (z = -0.04) ---
const RZ=-0.045;
const adf=module(0.055,0.012,0.036,M.pcb,[{name:'out',side:'r',y:0.006,off:0.008}]); at(adf,-0.19,TOP,RZ); bench.add(adf); reg('A2',adf,'ADF4351 board — the sweep source, +5 dBm','rf');
adf.add(at(cyl(0.0035,0.003,M.sma,8),-0.012,0.0135,-0.008)); // TCXO can-ish
const hdrA=box(0.020,0.008,0.0025,M.black); hdrA.position.set(-0.015,0.016,0.016); adf.add(hdrA);
const att=module(0.028,0.010,0.010,M.dark,[{name:'in',side:'l'},{name:'out',side:'r'}]); at(att,-0.135,TOP+0.010,RZ+0.006); bench.add(att); reg('A5',att,'3 dB attenuator, SMA inline','rf');
const pa=module(0.040,0.012,0.028,M.pcbBlue,[{name:'in',side:'l',y:0.006},{name:'out',side:'r',y:0.006}]); at(pa,-0.085,TOP,RZ); bench.add(pa); reg('A3a',pa,'PA — SPF5189Z module, +12 dB','rf');
pa.add(at(box(0.018,0.004,0.014,M.alu),0,0.014,0)); // shield can
const spl=module(0.032,0.014,0.022,M.alu,[{name:'s',side:'l'},{name:'o1',side:'r',off:-0.006},{name:'o2',side:'r',off:0.006}]); at(spl,-0.030,TOP,RZ); bench.add(spl); reg('A4',spl,'2-way splitter, 800–2500 MHz','rf');
const mix=module(0.020,0.012,0.020,M.alu,[{name:'lo',side:'l'},{name:'rf',side:'r'},{name:'if',side:'f'}]); at(mix,0.040,TOP,RZ+0.004); bench.add(mix); reg('A1',mix,'mixer ZX05-43MH-S+ — LO · RF · IF','rf');
const lna=module(0.040,0.012,0.028,M.pcbBlue,[{name:'out',side:'l',y:0.006},{name:'in',side:'r',y:0.006}]); at(lna,0.100,TOP,RZ); bench.add(lna); reg('A3b',lna,'LNA — SPF5189Z module, NF ~1 dB','rf');
lna.add(at(box(0.018,0.004,0.014,M.alu),0,0.014,0));
const bpf=module(0.050,0.012,0.012,M.alu,[{name:'out',side:'l'},{name:'in',side:'r'}]); at(bpf,0.160,TOP+0.006,RZ+0.006); bench.add(bpf); reg('A7b',bpf,'band-pass 2400–2500 MHz, SMA inline','rf');
addLabel(adf,'ADF4351','rf'); addLabel(att,'3 dB pad','rf'); addLabel(pa,'PA','rf'); addLabel(spl,'splitter','rf'); addLabel(mix,'mixer','rf'); addLabel(lna,'LNA','rf'); addLabel(bpf,'band-pass','rf');

// --- horns ---
const GW=0.0864/2, GH=0.0432/2, AW=0.2638/2, AH=0.1931/2, FL=0.0915, GL=0.115;
function flareGeom(){ const g=[[-GW,-GH,0],[GW,-GH,0],[GW,GH,0],[-GW,GH,0]], a=[[-AW,-AH,FL],[AW,-AH,FL],[AW,AH,FL],[-AW,AH,FL]]; const pos=[]; for(let i=0;i<4;i++){const j=(i+1)%4; pos.push(...g[i],...g[j],...a[j],...g[i],...a[j],...a[i]);} const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.computeVertexNormals(); return geo; }
const FLARE=flareGeom();
function horn(tintMat){ const g=new THREE.Group();
  g.add(new THREE.Mesh(FLARE,M.copper)); const inner=new THREE.Mesh(FLARE,M.metalIn); inner.scale.set(.985,.985,1); g.add(inner);
  const guide=box(GW*2,GH*2,GL,M.copper); guide.position.z=-GL/2; g.add(guide);
  const RB=0.008; [[0,AH+RB/2],[0,-AH-RB/2]].forEach(([x,y])=>{const m=box(AW*2+RB*2,RB,0.004,tintMat); m.position.set(x,y,FL); g.add(m);});
  [[AW+RB/2,0],[-AW-RB/2,0]].forEach(([x,y])=>{const m=box(RB,AH*2,0.004,tintMat); m.position.set(x,y,FL); g.add(m);});
  // SMA flange + probe at 43.7 mm from the back wall, on the broad (top) wall
  const fl=box(0.0127,0.0016,0.0127,M.sma); fl.position.set(0,GH+0.0008,-GL+0.0437); g.add(fl);
  const p=sma(0.009); p.rotation.z=Math.PI/2; p.position.set(0,GH+0.0016,-GL+0.0437); g.add(p);
  const probe=cyl(0.0008,0.028,M.copper,6); probe.position.set(0,GH-0.014,-GL+0.0437); g.add(probe); g.userData.feed=p;
  return g; }
const HY=0.30, HZ=-0.135;
const stage1=new THREE.Group(), stage23=new THREE.Group(); bench.add(stage1,stage23);
const h1tx=horn(M.rf), h1rx=horn(M.dsp); h1tx.position.set(-0.145,HY,HZ); h1rx.position.set(0.145,HY,HZ); h1tx.rotation.y=Math.PI; h1rx.rotation.y=Math.PI; stage1.add(h1tx,h1rx);
[-0.145,0.145].forEach(x=>{ const post=box(0.016,HY-0.02,0.016,M.dark); post.position.set(x,TOP+(HY-0.02)/2,HZ-0.10); stage1.add(post); const br=box(0.03,0.002,0.03,M.alu); br.position.set(x,TOP+0.001,HZ-0.10); stage1.add(br); });
reg('B8',h1tx,'TX horn — 0.021" copper, 264 × 193 mm mouth','rf'); reg('B8',h1rx,'RX horn — same, E-plane vertical','dsp');
addLabel(h1tx,'TX horn','rf',new THREE.Vector3(0,AH+.03,0)); addLabel(h1rx,'RX horn','dsp',new THREE.Vector3(0,AH+.03,0));
// turntable (stage 2/3): NEMA-17 + lazy susan + mast + plate
const nema=box(0.042,0.042,0.042,M.black); nema.position.set(0,TOP+0.021,HZ-0.10); stage23.add(nema); reg('D18a',nema,'NEMA-17 stepper','ok');
const shaft=cyl(0.0025,0.02,M.lead,8); shaft.position.set(0,TOP+0.052,HZ-0.10); stage23.add(shaft);
const susan=cyl(0.075,0.008,M.alu,32); susan.position.set(0,TOP+0.046,HZ-0.10); stage23.add(susan); reg('D18b',susan,'lazy-susan bearing 150 mm','ok');
const rotG=new THREE.Group(); rotG.position.set(0,TOP+0.050,HZ-0.10); stage23.add(rotG);
const plate=cyl(0.09,0.006,M.wood,32); plate.position.y=0.003; rotG.add(plate);
const mast=cyl(0.011,HY-0.06,M.dark,12); mast.position.y=(HY-0.06)/2; rotG.add(mast);
const yoke=box(0.34,0.012,0.03,M.dark); yoke.position.set(0,HY-TOP-0.05,0.0); rotG.add(yoke);
const h2tx=horn(M.rf), h2rx=horn(M.dsp); h2tx.position.set(-0.145,HY-TOP-0.05,-0.02); h2rx.position.set(0.145,HY-TOP-0.05,-0.02); h2tx.rotation.y=Math.PI; h2rx.rotation.y=Math.PI; rotG.add(h2tx,h2rx);
reg('B8',h2tx,'TX horn (on the turntable)','rf'); reg('B8',h2rx,'RX horn (on the turntable)','dsp');
addLabel(h2tx,'TX horn','rf',new THREE.Vector3(0,AH+.03,0)); addLabel(h2rx,'RX horn','dsp',new THREE.Vector3(0,AH+.03,0));
const h3=horn(M.ok); h3.position.set(0.145,HY-TOP-0.05-0.1931,-0.02); h3.rotation.y=Math.PI; rotG.add(h3); reg('F24',h3,'3rd horn — RX 2, 193 mm below RX 1','ok'); addLabel(h3,'RX 2','ok',new THREE.Vector3(0,-AH-.03,0));
const a4988=box(0.020,0.004,0.015,M.pcbRed); a4988.position.set(0.19,TOP+0.002,0.15); bench.add(a4988); reg('D18c',a4988,'A4988 stepper driver','ok'); addLabel(a4988,'A4988','ok');
const susanCable=[]; // stepper wire
const stepWire=tube([new THREE.Vector3(0.19,TOP+0.006,0.15),new THREE.Vector3(0.21,TOP+0.03,0.05),new THREE.Vector3(0.06,TOP+0.03,-0.20),new THREE.Vector3(0.021,TOP+0.03,HZ-0.10)],0.0015,M.rubber); stage23.add(stepWire);

// --- breadboard ---
const BBW=0.165, BBD=0.055, BBH=0.009, PITCH=0.00254;
const bbG=new THREE.Group(); bbG.position.set(-0.075,TOP,0.085); bench.add(bbG);
const bbBody=box(BBW,BBH,BBD,M.bb); bbBody.position.y=BBH/2; bbG.add(bbBody); reg('C15a',bbBody,'830-point breadboard','dsp');
// hole grid: columns 1..63 along x, rows a-e (z from -0.01 to -0.0002) and f-j; rails top/bottom
const COL0=-BBW/2+0.006; const rowZ={};
'abcde'.split('').forEach((r,i)=>rowZ[r]=-0.0127+i*PITCH+0.0025); 'fghij'.split('').forEach((r,i)=>rowZ[r]=0.0025+i*PITCH+0.0005);
rowZ['R1']=-0.0235; rowZ['R2']=-0.0235+PITCH; rowZ['R3']=0.0235-PITCH; rowZ['R4']=0.0235;
function hx(col){ return COL0+(col-1)*PITCH; }
const holeGeo=new THREE.BoxGeometry(0.0009,0.0006,0.0009); const holes=new THREE.InstancedMesh(holeGeo,M.hole,63*10+4*60); let hi=0; const hm=new THREE.Matrix4();
for(let c=1;c<=63;c++) for(const r of 'abcdefghij'){ hm.makeTranslation(hx(c),BBH+0.0002,rowZ[r]); holes.setMatrixAt(hi++,hm); }
for(let c=1;c<=60;c++) for(const r of ['R1','R2','R3','R4']){ hm.makeTranslation(hx(c+1.5),BBH+0.0002,rowZ[r]); holes.setMatrixAt(hi++,hm); }
holes.count=hi; bbG.add(holes);

  while(coaxG.children.length) coaxG.remove(coaxG.children[0]);

 ['F · Stage 3 (later)',[
  ['F22','2nd ZX05-43MH-S+ mixer + 2nd LNA','1','$73'],['F23','2nd 2-way splitter','1','$13'],['F24','3rd horn (materials in B)','1','$0'],['F25','Behringer UMC404HD 4-in interface','1','$100']]],
];
const NOTMODELLED=new Set(['B11','B12']);
const bomEl=document.getElementById('bom'); let selRow=null;
BOM.forEach(([title,rows])=>{ const h=document.createElement('h2'); h.textContent=title; bomEl.appendChild(h);
  rows.forEach(([id,name,qty,price,note])=>{ const r=document.createElement('div'); r.className='row'+(NOTMODELLED.has(id)?' na':''); r.dataset.id=id;
    r.innerHTML=`<span class="n">${id}</span><span>${name}${note?`<small>${note}</small>`:''}</span><span class="q">${qty} · ${price}</span>`;
    if(!NOTMODELLED.has(id)) r.onclick=()=>{ selectBom(id,r); }; bomEl.appendChild(r); }); });
const tot=document.createElement('div'); tot.className='total'; tot.innerHTML='Stage 1 ≈ $374 · + stage 2 ≈ $424 · + stage 3 ≈ $650<br><span class="legend"><span class="sw" style="background:#c2622a"></span>RF <span class="sw" style="background:#2f77b0"></span>baseband/ADC <span class="sw" style="background:#2c9c68"></span>control <span class="sw" style="background:#b8860b"></span>power <span class="sw" style="background:#6a4fbf"></span>drone</span>'; bomEl.appendChild(tot);

let highlight=[]; let hlT=0;
function selectBom(id,rowEl){
  if(selRow) selRow.classList.remove('sel'); selRow=rowEl; if(rowEl) rowEl.classList.add('sel');
  highlight.forEach(o=>{ o.material=o.userData.origMat; }); highlight=[];
  const objs=(registry[id]||[]).filter(o=>isShown(o));
  if(!objs.length) return;
  objs.forEach(o=>o.traverse(m=>{ if(m.isMesh){ if(!m.userData.origMat) m.userData.origMat=m.material; m.material=M.glow; highlight.push(m);} }));
  hlT=performance.now();
  // frame the first object
  const bb=new THREE.Box3(); objs.forEach(o=>bb.expandByObject(o)); const c=bb.getCenter(new THREE.Vector3()); const size=bb.getSize(new THREE.Vector3()).length();
  flyTo(c, Math.max(0.12, size*1.6), id.startsWith('E')?-0.3:az, id.startsWith('E')?0.15:0.45);
  status.textContent=objs[0].userData.name||id;
}
function isShown(o){ let p=o; while(p){ if(!p.visible) return false; p=p.parent; } return true; }

// =====================================================================
// stages, views, controls
// =====================================================================
let stage=1;
function setStage(s){ stage=s; stage1.visible=(s===1); stage23.visible=(s!==1); stage3.forEach(o=>o.visible=(s===3)); document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('on',+b.dataset.stage===s)); buildCoax(s); }
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));
let az=-0.62, el=0.42, dist=1.0, tgt=new THREE.Vector3(0,0.16,0.02);
let goal=null;
function place(){ camera.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az), tgt.y+dist*Math.sin(el), tgt.z+dist*Math.cos(el)*Math.cos(az)); camera.lookAt(tgt); }
function flyTo(t,d,a,e){ goal={t:t.clone(),d,a:(a!==undefined?a:az),e:(e!==undefined?e:el)}; }
const views={ bench:{t:new THREE.Vector3(0,0.16,0.02),d:1.0,a:-0.62,e:0.42}, bb:{t:new THREE.Vector3(-0.075,TOP+0.01,0.085),d:0.22,a:-0.15,e:0.9}, room:{t:new THREE.Vector3(0.15,0.6,-1.3),d:3.0,a:-0.38,e:0.16} };
function setView(k){ ['bench','bb','room'].forEach(v=>document.getElementById('b-'+v).classList.toggle('on',v===k)); const v=views[k]; flyTo(v.t,v.d,v.a,v.e); beam.visible=(k==='room'); }
['bench','bb','room'].forEach(k=>document.getElementById('b-'+k).onclick=()=>setView(k));
let showLabels=true, showCoax=true;
document.getElementById('b-labels').onclick=e=>{showLabels=!showLabels;e.target.classList.toggle('on',showLabels);};
document.getElementById('b-coax').onclick=e=>{showCoax=!showCoax;e.target.classList.toggle('on',showCoax);coaxG.visible=showCoax;};
let drag=false,px=0,py=0,moved=false;
cv.addEventListener('pointerdown',e=>{drag=true;moved=false;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=false; if(!moved) pick(e,true);});
cv.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-px, dy=e.clientY-py; if(Math.abs(dx)+Math.abs(dy)>2) moved=true; az-=dx*0.008; el=Math.max(-0.2,Math.min(1.45,el+dy*0.006)); px=e.clientX;py=e.clientY; goal=null; place(); } else pick(e,false); });
cv.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.max(0.08,Math.min(8,dist*(e.deltaY>0?1.12:0.89))); goal=null; place();},{passive:false});
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e,click){ const r=cv.getBoundingClientRect(); mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1; ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(isShown),false); if(hits.length){ const o=hits[0].object; tip.textContent=o.userData.name||''; tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.style.opacity=1; cv.style.cursor='pointer';
    if(click){ const id=o.userData.bom; const row=document.querySelector(`.row[data-id="${id}"]`); if(row){ row.scrollIntoView({block:'nearest'}); } selectBom(id,row); } }
  else { tip.style.opacity=0; cv.style.cursor='grab'; } }
const status=document.getElementById('status');

function resize(){ const w=vp.clientWidth,h=vp.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); place(); }
window.addEventListener('resize',resize);
const v=new THREE.Vector3(); const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches; let t0=performance.now();
function frame(now){ const dt=(now-t0)/1000; t0=now;
  if(goal){ const k=1-Math.pow(0.001,dt); tgt.lerp(goal.t,k); dist+=(goal.d-dist)*k; az+=(goal.a-az)*k; el+=(goal.e-el)*k; if(Math.abs(dist-goal.d)<1e-3 && tgt.distanceTo(goal.t)<1e-3) goal=null; place(); }
  if(!reduced && stage!==1){ rotG.rotation.y=Math.sin(now/4000)*0.6; }
  if(!reduced){ drone.rotation.y+=dt*0.4; drone.position.y=1.1+Math.sin(now/900)*0.03; }
  if(highlight.length){ M.glow.emissiveIntensity=0.5+0.5*Math.abs(Math.sin((now-hlT)/250)); if(now-hlT>4000){ highlight.forEach(o=>o.material=o.userData.origMat); highlight=[]; } }
  renderer.render(scene,camera);
  const w=vp.clientWidth,h=vp.clientHeight; const bbView = dist<0.35;
  labels.forEach(L=>{ const isBB = L.obj.userData.ref!==undefined; const vis=showLabels && isShown(L.obj) && (isBB ? bbView : !bbView); if(!vis){L.el.style.opacity=0;return;}
    L.obj.getWorldPosition(v); v.add(L.off); v.project(camera); if(v.z>1){L.el.style.opacity=0;return;} L.el.style.left=((v.x*0.5+0.5)*w)+'px'; L.el.style.top=((-v.y*0.5+0.5)*h)+'px'; L.el.style.opacity=1; });
  requestAnimationFrame(frame);
}
setStage(1); resize(); place(); status.textContent='stage 1 · fixed horn pair · hover for names, click a BOM row to fly to it'; requestAnimationFrame(frame);
})();
</script>
