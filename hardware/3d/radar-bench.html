<meta charset="utf-8">
<title>Radar Bench Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#e8ecf1; --surface:#f8fafc; --surface-2:#eef2f6;
    --ink:#0f151c; --ink-2:#3b4653; --muted:#69757f;
    --rule:#c3ccd6; --hair:#d7dee6;
    --rf:#c2622a; --dsp:#2f77b0; --ok:#22794c; --link:#6a4fbf; --pow:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
      --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
      --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
    --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
    --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100vh;min-height:640px}
  header{grid-column:1/3;padding:14px 20px 10px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  header .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rf)}
  header .sub{color:var(--ink-2);font-size:13px}
  #vp{position:relative;background:#0a0e13;overflow:hidden}
  #cv{display:block;width:100%;height:100%}
  #hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  button{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:3px}
  button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.grp{border-radius:0} button.grp:first-child{border-radius:3px 0 0 3px} button.grp:last-child{border-radius:0 3px 3px 0}
  .grpwrap{display:flex}
  #tip{position:absolute;pointer-events:none;background:rgba(15,21,28,.93);color:#e6ecf2;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:5px 8px;border-radius:3px;border:1px solid #3a4a5a;white-space:nowrap;opacity:0;transform:translate(-50%,-130%)}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:1px 5px;border-radius:2px;background:rgba(15,21,28,.78);color:#dfe6ee;border:1px solid rgba(255,255,255,.14);white-space:nowrap;opacity:0;transition:opacity .15s}
  .lbl.rf{color:#f0a878;border-color:rgba(240,168,120,.45)} .lbl.dsp{color:#89c2ea;border-color:rgba(137,194,234,.45)}
  .lbl.ok{color:#7ed6a6;border-color:rgba(126,214,166,.45)} .lbl.pow{color:#f2c86a;border-color:rgba(242,200,106,.45)}
  .lbl.link{color:#c0aef5;border-color:rgba(192,174,245,.45)}
  #status{position:absolute;left:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8593a0;max-width:70%}
  aside{background:var(--surface);border-left:1px solid var(--rule);overflow-y:auto;padding:12px 14px 30px}
  aside h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
  aside h2:first-child{margin-top:2px}
  .row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
  .row:hover{background:var(--surface-2)} .row.sel{border-color:var(--rf);background:var(--surface-2)}
  .row .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px}
  .row .q{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px;white-space:nowrap}
  .row.na{opacity:.6;cursor:default} .row small{display:block;color:var(--muted);font-size:11px}
  .total{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);padding:8px 6px;border-top:1px solid var(--rule);margin-top:10px}
  .legend{font-size:12px;color:var(--ink-2);margin:6px 0 0}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  @media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh 1fr} header{grid-column:1} aside{border-left:0;border-top:1px solid var(--rule)}}
</style>

<div id="app">
  <header>
    <div><div class="eyebrow">horn-fed FMCW radar · every BOM row · the breadboard, hole by hole</div><h1>Radar Bench Model</h1></div>
    <div class="sub">Drag to orbit · scroll to zoom · click a BOM row to fly to the part · hover anything for its name or pin.</div>
  </header>
  <section id="vp">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="grpwrap"><button class="grp on" data-stage="1">1 · TX + RX A</button><button class="grp" data-stage="2">2 · + RX B → azimuth</button></div>
      <button id="b-bench" class="on">Bench</button><button id="b-bb">Breadboard</button><button id="b-room">Room + drone</button>
      <button id="b-turn">Turntable</button><button id="b-labels" class="on">Labels</button><button id="b-coax" class="on">Coax</button><button id="b-wires" class="on">Wiring</button>
    </div>
    <div id="tip"></div>
    <div id="status"></div>
  </section>
  <aside id="bom"></aside>
</div>

<script>
(function(){
// =====================================================================
// setup
// =====================================================================
const cv=document.getElementById('cv'), vp=document.getElementById('vp'), tip=document.getElementById('tip');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.92;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
function gradientSky(){
  const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#18232e'); g.addColorStop(0.5,'#0e161d'); g.addColorStop(1,'#070a0e');
  x.fillStyle=g; x.fillRect(0,0,4,256); return new THREE.CanvasTexture(c);
}
scene.background=gradientSky();
scene.fog=new THREE.Fog(0x0b1219,6.5,22);
const camera=new THREE.PerspectiveCamera(38,1,0.008,60);

scene.add(new THREE.HemisphereLight(0xaecbe0,0x141b21,0.55));
const key=new THREE.DirectionalLight(0xfff2e2,1.05); key.position.set(0.9,1.9,1.1);
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.0006; key.shadow.normalBias=0.004;
const sc=key.shadow.camera; sc.left=-0.62; sc.right=0.62; sc.top=0.62; sc.bottom=-0.62; sc.near=0.4; sc.far=4.5; sc.updateProjectionMatrix();
scene.add(key);
const fill=new THREE.DirectionalLight(0xbcd4e8,0.30); fill.position.set(-1.6,1.0,1.4); scene.add(fill);
const rim=new THREE.DirectionalLight(0xe59055,0.42); rim.position.set(-1.2,0.7,-2.0); scene.add(rim);

const mat=(o)=>new THREE.MeshStandardMaterial(o);
const M={
  metalIn:mat({color:0x5d6873,metalness:.6,roughness:.38,side:THREE.BackSide}),
  alu:mat({color:0xa9b3bb,metalness:.65,roughness:.38}),
  aluDark:mat({color:0x78838c,metalness:.6,roughness:.45}),
  steel:mat({color:0x8d959c,metalness:.78,roughness:.30}),
  wood:mat({color:0xa8875c,roughness:.82}),
  pcb:mat({color:0x1f5d3a,roughness:.68}),
  pcbBlue:mat({color:0x1b3f7a,roughness:.68}),
  pcbRed:mat({color:0x8a2222,roughness:.68}),
  pcbBlack:mat({color:0x15181c,roughness:.62}),
  dark:mat({color:0x27313a,metalness:.3,roughness:.6}),
  black:mat({color:0x14181c,roughness:.55}),
  coax:mat({color:0x2b3239,metalness:.15,roughness:.62}),
  coaxRx:mat({color:0x2b4a68,metalness:.15,roughness:.62}),
  boot:mat({color:0x1a1f24,roughness:.85}),
  sma:mat({color:0xd9bd6c,metalness:.85,roughness:.24}),
  gold:mat({color:0xd4b25a,metalness:.8,roughness:.28}),
  tin:mat({color:0xbfc6cc,metalness:.75,roughness:.32}),
  bb:mat({color:0xf2f0e6,roughness:.85}),
  hole:mat({color:0x33383d,roughness:.9}),
  res:mat({color:0xd9c39a,roughness:.65}),
  film:mat({color:0xd8b53a,roughness:.65}),
  cer:mat({color:0xd08a3a,roughness:.65}),
  elec:mat({color:0x1d2330,roughness:.55}),
  lead:mat({color:0xc9ccd0,metalness:.7,roughness:.35}),
  copper:mat({color:0xc07a3e,metalness:.78,roughness:.31,side:THREE.DoubleSide}),
  copperSeam:mat({color:0x9aa3ac,metalness:.6,roughness:.42}),
  screen:mat({color:0x0a1622,emissive:0x0d2740,emissiveIntensity:.45,roughness:.35}),
  brick:mat({color:0x2b2f34,roughness:.65}),
  rubber:mat({color:0x1c1f23,roughness:.9}),
  ledRed:mat({color:0xd03028,emissive:0x8a1008,emissiveIntensity:.7,roughness:.4}),
  ledBlue:mat({color:0x3070d0,emissive:0x0a3a8a,emissiveIntensity:.7,roughness:.4}),
  glow:mat({color:0xffc06a,emissive:0xff9a2a,emissiveIntensity:.9,transparent:true,opacity:.9}),
};
// wire gauges: RG316 2.5 mm, 22 AWG hook-up 1.7 mm, breadboard jumper 0.9 mm
const R_COAX=0.00125, R_WIRE=0.00085, R_JUMP=0.00045;
// harness wire colours, as called out in WIRING.md
const WC={black:0x1a1a1a,red:0xc0392b,orange:0xe07b20,green:0x2ecc71,violet:0x8e44ad,
          blue:0x2e86de,yellow:0xd8c02a,white:0xe8e8e8,grey:0x8a949c,brown:0x7a4a24};
const wireMat={}; for(const k in WC) wireMat[k]=mat({color:WC[k],roughness:.7});

const pickables=[], labels=[], registry={};
function reg(id,obj,name,cls){ obj.userData.bom=id; obj.userData.name=name||id; if(cls) obj.userData.cls=cls;
  (registry[id]=registry[id]||[]).push(obj);
  obj.traverse(o=>{ if(o.isMesh){ if(o.userData.pinName===undefined) o.userData.name=obj.userData.name;
    o.userData.bom=id; if(!o.userData._pick){o.userData._pick=1; pickables.push(o);} } });
  return obj; }
function box(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); }
function cyl(r,h,m,seg=16){ return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); }
function tube(r1,r2,h,m,seg=16){ return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m); }
function at(m,x,y,z){ m.position.set(x,y,z); return m; }
function addLabel(obj,text,cls,off,major){ const el=document.createElement('div'); el.className='lbl '+(cls||''); el.textContent=text;
  vp.appendChild(el); labels.push({el,obj,off:off||new THREE.Vector3(0,.02,0),major:!!major}); }
function strut(a,b,r,m,seg=8){ const d=new THREE.Vector3().subVectors(b,a); const s=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),seg),m);
  s.position.copy(a).add(b).multiplyScalar(.5); s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize()); return s; }
function run(pts,r,m,seg){ const c=new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(c,seg||Math.max(28,pts.length*12),r,9,false),m); }

// --- named electrical pins -------------------------------------------
// Every connector pin is a real object with a name; hovering one names the net.
// `pinTop` is where the wire actually lands on the pin; `pinDir` is the
// direction a wire has to leave in, so every lead looks plugged in rather than
// merely passing near the connector.
function addPin(parent,name,x,y,z,mesh,dir){ mesh.position.set(x,y,z); mesh.userData.pinName=name;
  if(dir) mesh.userData.pinDir=dir; parent.add(mesh);
  (parent.userData.pins=parent.userData.pins||{})[name]=mesh; return mesh; }
function pinAt(comp,name){ const p=comp.userData.pins[name];
  if(!p) throw new Error('no pin '+name+' on '+(comp.userData.name||'?'));
  return p.localToWorld(new THREE.Vector3(0,p.userData.pinTop||0,0)); }
// {pos,dir} for a pin, in world space — the pair every wire is built from
function P(comp,name){
  const p=comp.userData.pins[name];
  if(!p) throw new Error('no pin '+name+' on '+(comp.userData.name||'?'));
  const d=(p.userData.pinDir||new THREE.Vector3(0,1,0)).clone();
  const o=p.localToWorld(new THREE.Vector3(0,0,0));
  return {pos:p.localToWorld(new THREE.Vector3(0,p.userData.pinTop||0,0)),
          dir:p.localToWorld(d).sub(o).normalize()};
}
const PV=(v,dx,dy,dz)=>({pos:v.clone(),dir:new THREE.Vector3(dx||0,dy===undefined?1:dy,dz||0).normalize()});

// =====================================================================
// bench and table
// =====================================================================
const BW=0.457, BD=0.381, BT=0.018, TOP=BT;
const world=new THREE.Group(); scene.add(world);
const table=new THREE.Mesh(new THREE.PlaneGeometry(8,8),mat({color:0x11171d,roughness:.95}));
table.rotation.x=-Math.PI/2; table.position.y=-0.0015; table.receiveShadow=true; scene.add(table);
const grid=new THREE.GridHelper(4,20,0x25333f,0x18222b); grid.material.opacity=.55; grid.material.transparent=true; scene.add(grid);

const bench=new THREE.Group(); world.add(bench);
const ply=box(BW,BT,BD,M.wood); ply.position.y=BT/2; bench.add(ply);
reg('D17',ply,'plywood board 18" × 15"');
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{ const f=cyl(0.008,0.004,M.rubber,12); f.position.set(sx*(BW/2-0.03),-0.002,sz*(BD/2-0.03)); bench.add(f); });

// =====================================================================
// RF modules — every SMA on one centre-line
// =====================================================================
const RFY=TOP+0.007, SMA_L=0.009;
const ZTX=-0.150, ZRX=-0.082, ZRX2=0.020;

function sma(){
  const g=new THREE.Group();
  const b=cyl(0.0031,SMA_L*0.5,M.sma,14); b.rotation.z=Math.PI/2; b.position.x=SMA_L*0.25; g.add(b);
  const nut=new THREE.Mesh(new THREE.CylinderGeometry(0.0043,0.0043,SMA_L*0.5,6),M.sma);
  nut.rotation.z=Math.PI/2; nut.rotation.x=Math.PI/12; nut.position.x=SMA_L*0.75; g.add(nut);
  const pin=cyl(0.0006,0.0022,M.gold,8); pin.rotation.z=Math.PI/2; pin.position.x=SMA_L+0.0006; g.add(pin);
  return g;
}
function rfBody(bodyMesh,w,d,ports){
  const g=new THREE.Group(); g.add(bodyMesh); g.userData.ports={}; g.userData.w=w; g.userData.d=d;
  (ports||[]).forEach(p=>{ const s=sma(), o=p.off||0;
    if(p.side==='r'){ s.position.set(w/2,0,o); }
    else if(p.side==='l'){ s.rotation.y=Math.PI; s.position.set(-w/2,0,o); }
    else if(p.side==='b'){ s.rotation.y=Math.PI/2; s.position.set(o,0,-d/2); }
    else { s.rotation.y=-Math.PI/2; s.position.set(o,0,d/2); }
    s.userData.pinName=p.name.toUpperCase(); g.add(s); g.userData.ports[p.name]=s; });
  return g;
}
function rfBox(w,h,d,m,ports){ return rfBody(box(w,h,d,m),w,d,ports); }
function rfBarrel(w,r,m,ports){
  const b=cyl(r,w,m,20); b.rotation.z=Math.PI/2;
  const g=rfBody(b,w,r*2,ports);
  const clip=box(0.010,RFY-TOP-r,0.012,M.dark); clip.position.y=-(r+(RFY-TOP-r)/2); g.add(clip);
  return g;
}
function putRF(g,x,z){ g.position.set(x,RFY,z); return g; }
function portPos(m,n){ return m.userData.ports[n].localToWorld(new THREE.Vector3(SMA_L,0,0)); }
function portDir(m,n){ const s=m.userData.ports[n];
  const a=s.localToWorld(new THREE.Vector3(0,0,0)), b=s.localToWorld(new THREE.Vector3(1,0,0)); return b.sub(a).normalize(); }

// A Mini-Circuits coax case: machined aluminium body, flanged base, part number on top
function mcCase(w,h,d,ports){
  const g=rfBox(w,h,d,M.alu,ports);
  g.add(at(box(w+0.006,0.0018,d+0.006,M.aluDark),0,-h/2+0.0009,0));   // mounting flange
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>
    g.add(at(cyl(0.0011,0.0022,M.steel,6),sx*(w/2+0.0018),-h/2+0.0019,sz*(d/2+0.0018))));
  g.add(at(box(w*0.7,0.0004,d*0.5,M.aluDark),0,h/2+0.0002,0));        // label panel
  return g;
}
// SPF5189Z evaluation module: blue PCB, SMA both ends, SMD amplifier and bias parts
function ampModule(){
  const g=rfBox(0.040,0.0016,0.028,M.pcbBlue,[{name:'in',side:'l'},{name:'out',side:'r'}]);
  g.add(at(box(0.0038,0.0011,0.0038,M.black),0,0.0014,0));            // SPF5189Z SOT-89
  [[-0.010,0],[0.010,0],[-0.006,0.007],[0.006,-0.007]].forEach(([x,z])=>
    g.add(at(box(0.0020,0.0009,0.0012,M.tin),x,0.0013,z)));           // 0805 blocking caps
  g.add(at(cyl(0.0012,0.0020,M.black,10),0.000,0.0018,-0.009));       // bias choke
  g.add(at(box(0.0060,0.0008,0.0025,M.gold),-0.014,0.0012,0.011));    // 5 V / GND pads
  const p5=box(0.0016,0.0006,0.0016,M.gold); addPin(g,'5V',-0.0155,0.0016,0.011,p5);
  const pg=box(0.0016,0.0006,0.0016,M.gold); addPin(g,'GND',-0.0125,0.0016,0.011,pg);
  return g;
}

const adf=rfBox(0.055,0.0016,0.036,M.pcb,[{name:'out',side:'r'}]); putRF(adf,-0.180,ZTX); bench.add(adf);
reg('A2',adf,'ADF4351 board — the sweep source, +5 dBm','rf');
adf.add(at(box(0.0165,0.0028,0.0165,M.aluDark),0.006,0.0022,-0.002));      // synthesiser shield can
adf.add(at(box(0.0072,0.0032,0.0050,M.black),-0.016,0.0024,-0.010));       // 25 MHz TCXO
adf.add(at(cyl(0.0022,0.0022,M.alu,12),-0.020,0.0019,0.008));              // 3V3 regulator + bulk cap
adf.add(at(box(0.0030,0.0010,0.0016,M.ledRed),0.022,0.0013,-0.013));       // lock-detect LED
// the ADF4351's 8-pin logic/power header, along the front edge
const ADFPINS=['VCC','GND','CLK','DATA','LE','CE','LD','MUX'];
adf.add(at(box(ADFPINS.length*0.00254,0.0022,0.0025,M.black),(ADFPINS.length-1)*0.00127-0.014,0.0019,0.0155));
ADFPINS.forEach((n,i)=>{ const p=box(0.0006,0.006,0.0006,M.gold);
  p.userData.pinTop=0.003; addPin(adf,n,-0.014+i*0.00254,0.0035,0.0155,p); });

const att=rfBarrel(0.026,0.0055,M.aluDark,[{name:'in',side:'l'},{name:'out',side:'r'}]); putRF(att,-0.1015,ZTX); bench.add(att);
reg('A5',att,'3 dB attenuator, SMA inline','rf');
const pa=ampModule(); putRF(pa,-0.0305,ZTX); bench.add(pa); reg('A3a',pa,'PA — SPF5189Z module, +12 dB','rf');
const spl=mcCase(0.032,0.014,0.024,[{name:'s',side:'l'},{name:'o1',side:'f',off:-0.008},{name:'o2',side:'f',off:0.008}]);
putRF(spl,0.0435,ZTX); bench.add(spl); reg('A4',spl,'2-way splitter, 800–2500 MHz','rf');

const bpf=rfBarrel(0.042,0.0065,M.alu,[{name:'out',side:'l'},{name:'in',side:'r'}]); putRF(bpf,0.180,ZRX); bench.add(bpf);
reg('A7b',bpf,'band-pass 2400–2500 MHz, SMA inline','rf');
const lna=ampModule(); putRF(lna,0.101,ZRX); bench.add(lna); reg('A3b',lna,'LNA — SPF5189Z module, NF ~1 dB','rf');
lna.rotation.y=Math.PI;                                     // input faces the horn, output faces the mixer
const mix=mcCase(0.022,0.014,0.020,[{name:'lo',side:'b'},{name:'rf',side:'r'},{name:'if',side:'f'}]);
putRF(mix,0.032,ZRX); bench.add(mix); reg('A1',mix,'mixer ZX05-43MH-S+ — LO · RF · IF','rf');

const GW=0.0864/2, GH=0.0432/2, AW=0.2638/2, AH=0.1931/2, FL=0.0915, GL=0.115;
function flareGeom(){ const g=[[-GW,-GH,0],[GW,-GH,0],[GW,GH,0],[-GW,GH,0]], a=[[-AW,-AH,FL],[AW,-AH,FL],[AW,AH,FL],[-AW,AH,FL]];
  const pos=[]; for(let i=0;i<4;i++){const j=(i+1)%4; pos.push(...g[i],...g[j],...a[j],...g[i],...a[j],...a[i]);}
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.computeVertexNormals(); return geo; }
const FLARE=flareGeom();
function horn(tintMat){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(FLARE,M.copper));
  const inner=new THREE.Mesh(FLARE,M.metalIn); inner.scale.set(.988,.988,1); g.add(inner);
  g.add(at(box(GW*2,GH*2,GL,M.copper),0,0,-GL/2));
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sy])=>
    g.add(strut(new THREE.Vector3(sx*GW,sy*GH,0),new THREE.Vector3(sx*AW,sy*AH,FL),0.0011,M.copperSeam,6)));
  const RB=0.006;
  [[0,AH+RB/2],[0,-AH-RB/2]].forEach(([x,y])=>g.add(at(box(AW*2+RB*2,RB,0.0035,tintMat),x,y,FL)));
  [[AW+RB/2,0],[-AW-RB/2,0]].forEach(([x,y])=>g.add(at(box(RB,AH*2,0.0035,tintMat),x,y,FL)));
  const fz=-GL+0.0437;
  const fl=box(0.0127,0.0018,0.0127,M.sma); fl.position.set(0,GH+0.0009,fz); g.add(fl);
  [[-0.0048,-0.0048],[0.0048,-0.0048],[-0.0048,0.0048],[0.0048,0.0048]].forEach(([bx,bz])=>
    g.add(at(cyl(0.0012,0.0022,M.aluDark,6),bx,GH+0.0025,fz+bz)));

// points UP because it drives the turntable, and the 4-pin connector the A4988
// plugs into.
function nema17(){
  const g=new THREE.Group(); const S=0.0423, LEN=0.040;
  const stack=new THREE.Mesh(new THREE.CylinderGeometry(S*0.72,S*0.72,LEN-0.016,8),M.steel);
  stack.rotation.y=Math.PI/8; g.add(stack);
  [-1,1].forEach(s=>{
    g.add(at(box(S,0.008,S,M.aluDark),0,s*(LEN/2-0.004),0));
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{
      const c=box(0.008,0.0082,0.008,M.dark); c.rotation.y=Math.PI/4;
      c.position.set(a*S/2,s*(LEN/2-0.004),b*S/2); g.add(c); });
  });
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>
    g.add(at(cyl(0.0015,LEN+0.001,M.steel,8),a*0.0155,0,b*0.0155)));
  g.add(at(cyl(0.011,0.002,M.alu,24),0,LEN/2+0.001,0));            // 22 mm pilot boss
  g.add(at(cyl(0.0025,0.022,M.steel,16),0,LEN/2+0.013,0));         // 5 mm D-shaft, upward
  g.add(at(box(0.0012,0.014,0.005,M.steel),0.0019,LEN/2+0.014,0)); // the flat
  // 4-pin JST-XH on the rear face - where the A4988's motor leads plug in
  g.add(at(box(0.014,0.008,0.006,mat({color:0xdedede,roughness:.6})),0,-LEN/2+0.007,-S/2-0.003));
  g.add(at(box(0.012,0.006,0.001,M.dark),0,-LEN/2+0.007,-S/2-0.0061));
  ['M1','M2','M3','M4'].forEach((n,i)=>{
    const p=box(0.0009,0.0009,0.005,M.gold); p.userData.pinTop=0;
    addPin(g,n,-0.0045+i*0.003,-LEN/2+0.007,-S/2-0.008,p,new THREE.Vector3(0,0,-1));
    p.userData.name='NEMA-17 '+n+' (coil '+(i<2?'A':'B')+')';
  });

}

const BBW=0.165, BBD=0.055, BBH=0.009, PITCH=0.00254;

const bbG=new THREE.Group(); bbG.position.set(BBX,TOP,BBZ); bench.add(bbG);

const COL0=-BBW/2+0.006, rowZ={};
'abcde'.split('').forEach((r,i)=>rowZ[r]=-0.00381-(4-i)*PITCH);
'fghij'.split('').forEach((r,i)=>rowZ[r]= 0.00381+i*PITCH);
// rails: TR+ top red = V5, TR- top blue = GND, BR+ bottom red = VANA, BR- bottom blue = GND
rowZ['TR+']=-0.02096; rowZ['TR-']=-0.0235; rowZ['BR+']=0.02096; rowZ['BR-']=0.0235;
function hx(col){ return COL0+(col-1)*PITCH; }
function parseHole(s){
  let m=/^([a-j])(\d+)$/.exec(s);
  if(m) return {x:hx(+m[2]),z:rowZ[m[1]]};
  m=/^(TR|BR)([+-])@(\d+)$/.exec(s);
  if(m) return {x:hx(+m[3]),z:rowZ[m[1]+m[2]]};
  throw new Error('bad hole ref: '+s);
}
const holeV=s=>{ const p=parseHole(s); return new THREE.Vector3(p.x,BBH,p.z); };          // bbG-local
const holeW=(s,dy)=>{ const p=parseHole(s); return new THREE.Vector3(BBX+p.x,TOP+BBH+(dy||0),BBZ+p.z); };  // world

for(let c=1;c<=63;c++) for(const r of 'abcdefghij'){ hm.makeTranslation(hx(c),BBH+0.0002,rowZ[r]); holes.setMatrixAt(hi++,hm); }
for(let c=1;c<=63;c++) for(const r of ['TR+','TR-','BR+','BR-']){ hm.makeTranslation(hx(c),BBH+0.0002,rowZ[r]); holes.setMatrixAt(hi++,hm); }

// --- part bodies, each built lying along local +z between its two leads ---
const BANDS={0:0x1a1a1a,1:0x8b4513,2:0xdd2222,3:0xff8800,4:0xeeee00,5:0x22aa22,6:0x2222dd,7:0x882aa0,8:0x888888,9:0xffffff};
function bandColors(v){ let n=parseFloat(v); if(/k/.test(v)) n*=1e3; if(/M/.test(v)) n*=1e6;
  const e=Math.floor(Math.log10(n))-1, s=Math.round(n/Math.pow(10,e)); return [Math.floor(s/10)%10,s%10,Math.max(e,0)]; }
function bodyRes(val){ const g=new THREE.Group(); const b=cyl(0.0012,0.0064,M.res,12); g.add(b);
  bandColors(val).concat([null]).forEach((d,i)=>{ const r=cyl(0.00126,0.0006,mat({color:d===null?0xd4a017:BANDS[d],roughness:.6}),12);
    r.position.z=-0.0022+i*0.0011; r.rotation.x=Math.PI/2; g.add(r); });
  b.rotation.x=Math.PI/2; return g; }
function bodyDiode(){ const g=new THREE.Group(); const b=cyl(0.0026,0.0085,M.black,12); b.rotation.x=Math.PI/2; g.add(b);
  const k=cyl(0.0027,0.0008,mat({color:0xcfd6dd,roughness:.7}),12); k.rotation.x=Math.PI/2; k.position.z=0.0030; g.add(k); return g; }
function bodyBead(){ const b=cyl(0.0018,0.006,mat({color:0x55595e,roughness:.8}),12); b.rotation.x=Math.PI/2; return b; }
function bodyFilm(){ const g=new THREE.Group(); g.add(at(box(0.0045,0.006,0.0026,M.film),0,0.003,0)); return g; }
function bodyCer(){ const g=new THREE.Group(); const d=cyl(0.0021,0.0016,M.cer,16); d.rotation.x=Math.PI/2; d.position.y=0.0038; g.add(d); return g; }
function bodyElec(big){ const g=new THREE.Group(); const r=big?0.004:0.0026, h=big?0.011:0.007;
  g.add(at(cyl(r,h,M.elec,18),0,h/2+0.001,0));
  g.add(at(box(0.0012,h*0.8,0.0002,mat({color:0xcfd6dd,roughness:.7})),-r*0.72,h/2+0.001,r*0.55));
  g.add(at(cyl(r*0.92,0.0006,mat({color:0x2b3140,roughness:.6}),18),0,h+0.001,0)); return g; }

const AXIAL={res:1,diode:1,bead:1};
function placePart(kind,val,hA,hB){
  const a=holeV(hA), b=holeV(hB), g=new THREE.Group();
  const dx=b.x-a.x, dz=b.z-a.z, len=Math.hypot(dx,dz);
  const lift = AXIAL[kind] ? 0.0019 : 0.0006;
  g.position.set((a.x+b.x)/2, BBH+lift, (a.z+b.z)/2);
  g.rotation.y=Math.atan2(dx,dz);
  let body;
  if(kind==='res') body=bodyRes(val); else if(kind==='diode') body=bodyDiode(); else if(kind==='bead') body=bodyBead();
  else if(kind==='film') body=bodyFilm(); else if(kind==='cer') body=bodyCer();
  else if(kind==='elec') body=bodyElec(false); else if(kind==='elecB') body=bodyElec(true);
  g.add(body);
  // leads: out to each hole, then straight down into the board
  const half=AXIAL[kind]? Math.min(len/2,0.0045) : 0.0;
  [-1,1].forEach(s=>{
    const from=new THREE.Vector3(0,0,s*half), to=new THREE.Vector3(0,0,s*len/2);
    if(half>0.0001) g.add(strut(from,to,0.00032,M.lead,6));
    g.add(strut(to,new THREE.Vector3(0,-lift-0.0022,s*len/2),0.00032,M.lead,6));
  });
  return g;
}
function placeDip(colLo,colHi){                       // DIP-8 straddling the channel, notch toward colHi
  const g=new THREE.Group();
  g.position.set((hx(colLo)+hx(colHi))/2,BBH,0);
  g.add(at(box((colHi-colLo)*PITCH+0.0024,0.0035,0.0064,M.black),0,0.0035,0));
  g.add(at(cyl(0.0008,0.0011,M.dark,10),(colHi-colLo)*PITCH/2-0.0002,0.0053,0));
  for(let i=0;i<4;i++) [-1,1].forEach(s=>{
    const x=(-1.5+i)*PITCH;
    g.add(at(box(0.0006,0.0034,0.00035,M.lead),x,0.0015,s*0.00381));
  });
  return g;
}
function placeHeader(n,hFirst,ascending){
  const p=parseHole(hFirst), g=new THREE.Group();
  const step=(ascending===false?-1:1)*PITCH;
  g.position.set(p.x,BBH,p.z);
  g.add(at(box(Math.abs(n*step),0.0025,0.0025,M.black),(n-1)*step/2,0.00125,0));
  const pins=[];
  for(let i=0;i<n;i++){ const pin=box(0.0007,0.009,0.0007,M.gold); pin.userData.pinTop=0.0045; pins.push(pin); }
  g.userData.headerPins=pins; g.userData.step=step;
  return g;
}

// =====================================================================
// the harness — every wire runs between two real pins
// =====================================================================
const wireG=new THREE.Group(); world.add(wireG);
const stepWireG=new THREE.Group(); turnG.add(stepWireG);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

// Wiring rules, so a lead can be followed end to end:
//  - it leaves its pin along that pin's own axis, so it looks plugged in;
//  - it then drops to WY, a cable run a few mm above the plywood, and stays
//    there, hugging the board rather than flying over it;
//  - it routes through corridors between the modules instead of across them;
//  - parallel leads are fanned apart so they never merge into one rope.
const WY=TOP+0.0035;
const FRONT=0.116, BACKC=-0.116, MIDGAP=0.065, RIGHT=0.148, FAR=0.184;

function hookup(A,B,col,via,r){
  const outA=A.out||0.004, outB=B.out||0.004;
  const pts=[A.pos.clone(), A.pos.clone().addScaledVector(A.dir,outA)]
    .concat((via||[]).map(v=>v.clone()))
    .concat([B.pos.clone().addScaledVector(B.dir,outB), B.pos.clone()]);
  return run(pts,r||R_WIRE,wireMat[col]);
}
function link(name,A,B,col,via,into,r){
  const w=hookup(A,B,col,via,r); w.userData.name=name;
  reg('C15b',w,name,'pow'); (into||wireG).add(w); return w;
}
// corridor path at cable-run height: drops under A, follows [x,z] waypoints,
// rises under B. `s` fans parallel leads apart.
function route(A,B,corr,s){
  s=s||0;
  return [V(A.pos.x+s,WY,A.pos.z+s)]

const coaxG=new THREE.Group(); bench.add(coaxG);
const rotCoax=new THREE.Group(); rotG.add(rotCoax);
function boot(p,d,m){ return strut(p.clone().addScaledVector(d,-0.001),p.clone().addScaledVector(d,0.0075),0.0021,m||M.boot,10); }
function jumperCoax(ma,na,mb,nb,lift,m){
  const pa=portPos(ma,na), da=portDir(ma,na), pb=portPos(mb,nb), db=portDir(mb,nb);
  const a2=pa.clone().addScaledVector(da,0.014), b2=pb.clone().addScaledVector(db,0.014);
  const mid=a2.clone().add(b2).multiplyScalar(.5); mid.y+=lift;
  const g=new THREE.Group(); g.add(run([pa,a2,mid,b2,pb],R_COAX,m||M.coax)); g.add(boot(pa,da)); g.add(boot(pb,db)); return g;
}
function pathCoax(m,n,pts,mm,r){
  const p=portPos(m,n), d=portDir(m,n);
  const g=new THREE.Group(); g.add(run([p,p.clone().addScaledVector(d,0.014)].concat(pts),r||R_COAX,mm||M.coax)); g.add(boot(p,d)); return g;
}
function feedPoint(h,parent){
  const tip=h.userData.feed.localToWorld(new THREE.Vector3(SMA_L,0,0));
  const base=h.userData.feed.localToWorld(new THREE.Vector3(0,0,0));
  return {p:parent.worldToLocal(tip.clone()), d:tip.clone().sub(base).normalize()};
}
function feedCoax(h,parent,pts,m){
  const f=feedPoint(h,parent), g=new THREE.Group();
  g.add(run([f.p,f.p.clone().addScaledVector(f.d,0.016)].concat(pts),R_COAX,m));
  g.add(boot(f.p,f.d)); return g;
}
function buildCoax(stage){
  while(coaxG.children.length) coaxG.remove(coaxG.children[0]);
  while(rotCoax.children.length) rotCoax.remove(rotCoax.children[0]);
  const savedRot=rotG.rotation.y; rotG.rotation.y=0;
  bench.updateMatrixWorld(true);
  // Everything above the frame base turns with it when the turntable is fitted,
  // so each horn run hands over at a collar close to the rotation axis.
  const CY=TOP+0.090, CZ=ZCLAMP+0.034;
  const collar=(x,dy,dz)=>new THREE.Vector3(x,CY+(dy||0),CZ+(dz||0));
  const toRot=v=>new THREE.Vector3(v.x-rotG.position.x,v.y-rotG.position.y,v.z-rotG.position.z);

  const runs=[[adf,'out',att,'in',0.008],[att,'out',pa,'in',0.008],[pa,'out',spl,'s',0.009],
              [lna,'out',mix,'rf',0.011],[bpf,'out',lna,'in',0.010]];
  if(stage<2) runs.push([spl,'o2',mix,'lo',0.012]);
  runs.forEach(([ma,na,mb,nb,l])=>{
    const t=jumperCoax(ma,na,mb,nb,l); reg('A6',t,'SMA RG316 jumper','rf'); coaxG.add(t); });

  const cTX=collar(-0.055), cRA=collar(0.000,0.016,0.012), cRB=collar(0.055,0.032,0.024);
  // rolled 90 deg, every feed points the same way (-x): the two receive cables
  // then take the same path, which is what keeps them phase-matched.
  const up=(h,m,mm,c0,name,cls)=>{
    const x=m.position.x, y=m.position.y;
    const c=feedCoax(h,rotG,[V(x-0.055,y-0.022,-0.028),V(x*0.4-0.045,BEAM_RX*0.45,0.026),toRot(c0)],mm);
    reg('A6',c,name,cls||'rf'); rotCoax.add(c);
  };
  const t1=pathCoax(spl,'o1',[V(0.020,TOP+0.020,-0.112),V(-0.080,TOP+0.024,-0.098),
    V(-0.130,TOP+0.046,-0.056),cTX],M.coax);
  reg('A6',t1,'SMA RG316 jumper - splitter to TX horn','rf'); coaxG.add(t1);
  up(hTX,mTX,M.coax,cTX,'SMA RG316 jumper - splitter to TX horn');

  const t2=pathCoax(bpf,'in',[V(0.222,TOP+0.028,-0.070),V(0.130,TOP+0.036,-0.030),cRA],M.coaxRx);
  reg('A6',t2,'SMA RG316 jumper - RX A to band-pass','dsp'); coaxG.add(t2);
  up(hRXA,mRXA,M.coaxRx,cRA,'SMA RG316 jumper - RX A to band-pass','dsp');

  // mixer IF to J1 pin 1 on the breadboard
  const ifp=pathCoax(mix,'if',[V(0.030,TOP+0.026,-0.020),V(0.010,TOP+0.026,0.030),
    holeW('a2',0.014),holeW('a2',0.004)],M.rubber,R_WIRE);
  reg('A7',ifp,'IF pigtail - mixer IF to J1 pin 1 (a2)'); coaxG.add(ifp);

  if(stage>=2){
    [[spl,'o2',spl2,'s',0.010,'LO to the 2nd splitter'],[spl2,'o1',mix,'lo',0.010,'LO to mixer 1'],
     [spl2,'o2',mix2,'lo',0.014,'LO to mixer 2'],[lna2,'out',mix2,'rf',0.011,'LNA 2 to mixer 2'],
     [bpf2,'out',lna2,'in',0.010,'band-pass 2 to LNA 2']
    ].forEach(([ma,na,mb,nb,l,nm])=>{ const t=jumperCoax(ma,na,mb,nb,l);
      reg('A6',t,'SMA RG316 jumper - '+nm,'rf'); coaxG.add(t); });
    // The two receive cables must match: 1 mm of extra coax is 4.3 deg of phase
    // and about 0.3 deg of bearing, so RX B mirrors RX A's route exactly.
    const t3=pathCoax(bpf2,'in',[V(0.228,TOP+0.044,0.024),V(0.140,TOP+0.052,-0.012),cRB],M.coaxRx);
    reg('A6',t3,'SMA RG316 jumper - RX B to 2nd band-pass','ok'); coaxG.add(t3);
    up(hRXB,mRXB,M.coaxRx,cRB,'SMA RG316 jumper - RX B to 2nd band-pass','ok');
    const umcIn=P(umc,'IN1');
    const if2=pathCoax(mix2,'if',[V(0.100,TOP+0.014,0.055),V(0.180,TOP+0.014,0.115),
      V(0.270,0.026,0.200),umcIn.pos.clone().addScaledVector(umcIn.dir,0.012),umcIn.pos],M.rubber,R_WIRE);
    reg('A7',if2,'IF 2 to the UMC404HD (stage 2)'); coaxG.add(if2);
  }
  rotG.rotation.y=savedRot;
}

function beamCone(halfAz,halfEl,len){
  const w=Math.tan(halfAz*Math.PI/180)*len, h=Math.tan(halfEl*Math.PI/180)*len;
  const t=[0,0,0], c=[[-w,-h,len],[w,-h,len],[w,h,len],[-w,h,len]], pts=[];
  for(let i=0;i<4;i++){const j=(i+1)%4; pts.push(...t,...c[j],...c[i]);}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3)); g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xe59055,transparent:true,opacity:.11,side:THREE.DoubleSide,depthWrite:false})); }

    'stage 1 · TX + RX A in the three-horn frame → range and radial velocity',
    'stage 2 · RX B added → azimuth from phase, one 0.47 s dwell'][s]; }
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));
let turntable=false;
document.getElementById('b-turn').onclick=e=>{ turntable=!turntable;
  e.target.classList.toggle('on',turntable); setTurntable(turntable); buildCoax(stage); };

let az=-0.68, el=0.28, dist=1.62, tgt=new THREE.Vector3(0.00,0.30,-0.06), goal=null;
function place(){ camera.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(el)*Math.cos(az)); camera.lookAt(tgt); }
function flyTo(t,d,a,e){ goal={t:t.clone(),d,a:(a!==undefined?a:az),e:(e!==undefined?e:el)}; }
const views={ bench:{t:new THREE.Vector3(0.00,0.30,-0.06),d:1.62,a:-0.68,e:0.28},
              bb:{t:new THREE.Vector3(BBX,TOP+0.01,BBZ),d:0.20,a:-0.15,e:0.90},
              room:{t:new THREE.Vector3(0.08,0.62,-1.45),d:4.3,a:-0.42,e:0.20} };
let viewKey='bench';
function setView(k){ viewKey=k; ['bench','bb','room'].forEach(v=>document.getElementById('b-'+v).classList.toggle('on',v===k));
  const v=views[k]; flyTo(v.t,v.d,v.a,v.e); beams.forEach((b,i)=>b.visible=(k==='room') && ((i===0)===(stage===1))); }
['bench','bb','room'].forEach(k=>document.getElementById('b-'+k).onclick=()=>setView(k));

let showLabels=true;
document.getElementById('b-labels').onclick=e=>{showLabels=!showLabels;e.target.classList.toggle('on',showLabels);};
document.getElementById('b-coax').onclick=e=>{const v=!coaxG.visible;e.target.classList.toggle('on',v);
  coaxG.visible=v; rotCoax.visible=v;};
document.getElementById('b-wires').onclick=e=>{const v=!wireG.visible;e.target.classList.toggle('on',v);
  wireG.visible=v; stepWireG.visible=v; bbWireG.visible=v;};

let drag=false,px=0,py=0,moved=false;
cv.addEventListener('pointerdown',e=>{drag=true;moved=false;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=false; if(!moved) pick(e,true);});
cv.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-px, dy=e.clientY-py;
    if(Math.abs(dx)+Math.abs(dy)>2) moved=true; az-=dx*0.008; el=Math.max(-0.15,Math.min(1.45,el+dy*0.006));
    px=e.clientX;py=e.clientY; goal=null; place(); } else pick(e,false); });
cv.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.max(0.05,Math.min(8,dist*(e.deltaY>0?1.12:0.89))); goal=null; place();},{passive:false});

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e,click){ const r=cv.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1; ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(isShown),false);
  if(hits.length){ const o=hits[0].object; tip.textContent=o.userData.name||'';
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.style.opacity=1; cv.style.cursor='pointer';
    if(click){ const id=o.userData.bom; const row=document.querySelector(`.row[data-id="${id}"]`); if(row) row.scrollIntoView({block:'nearest'}); selectBom(id,row); } }
  else { tip.style.opacity=0; cv.style.cursor='grab'; } }
const status=document.getElementById('status');

function resize(){ const w=vp.clientWidth,h=vp.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); place(); }
window.addEventListener('resize',resize);

const v3=new THREE.Vector3(); const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches; let t0=performance.now();
function frame(now){ const dt=Math.min((now-t0)/1000,0.05); t0=now;
  if(goal){ const k=1-Math.pow(0.001,dt); tgt.lerp(goal.t,k); dist+=(goal.d-dist)*k; az+=(goal.a-az)*k; el+=(goal.e-el)*k;
    if(Math.abs(dist-goal.d)<1e-3 && tgt.distanceTo(goal.t)<1e-3) goal=null; place(); }
  if(!reduced && turntable) rotG.rotation.y=Math.sin(now/4000)*0.55;
  if(!reduced){ drone.rotation.y+=dt*0.4; drone.position.y=1.1+Math.sin(now/900)*0.03; }
  if(highlight.length){ M.glow.emissiveIntensity=0.5+0.5*Math.abs(Math.sin((now-hlT)/250));
    if(now-hlT>4000){ highlight.forEach(o=>o.material=o.userData.origMat); highlight=[]; } }
  renderer.render(scene,camera);
  const w=vp.clientWidth,h=vp.clientHeight, bbView=dist<0.35, wideView=dist>2.0;
  labels.forEach(L=>{ const isBB=L.obj.userData.ref!==undefined;
    const vis=showLabels && isShown(L.obj) && (isBB ? bbView : (!bbView && (!wideView || L.major)));
    if(!vis){L.el.style.opacity=0;return;}
    L.obj.getWorldPosition(v3); v3.add(L.off); v3.project(camera);
    if(v3.z>1){L.el.style.opacity=0;return;}
    L.el.style.left=((v3.x*0.5+0.5)*w)+'px'; L.el.style.top=((-v3.y*0.5+0.5)*h)+'px'; L.el.style.opacity=1; });
  requestAnimationFrame(frame);
}
setTurntable(false); setStage(1); resize(); place(); requestAnimationFrame(frame);
})();
</script>
