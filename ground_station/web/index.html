<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Ground Station</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='%233987e5' stroke-width='1.5'/><circle cx='8' cy='8' r='2.5' fill='%233987e5'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>RADAR&nbsp;GROUND&nbsp;STATION</h1>
      <span class="sub">passive RF localization</span>
    </div>
    <div class="pills">
      <span id="pill-link" class="pill">LINK&nbsp;<b>OFFLINE</b></span>
      <span id="pill-fix"  class="pill">FIX&nbsp;<b>—</b></span>
      <span id="pill-rec"  class="pill hidden">REC&nbsp;<b>●</b></span>
      <span id="clock" class="pill mono">--:--:--</span>
    </div>
  </header>

  <main>
    <section id="scope-wrap">
      <canvas id="scope"></canvas>
      <div id="scope-hud">
        <button id="btn-edit"  class="ghost" title="Drag nodes to reposition">EDIT LAYOUT</button>
        <button id="btn-sweep" class="ghost on" title="Toggle sweep animation">SWEEP</button>
        <button id="btn-reset" class="ghost" title="Reset view">RESET VIEW</button>
      </div>
      <div id="scope-readout" class="mono"></div>
    </section>

    <aside>
      <section class="panel" id="panel-fix">
        <h2>Position</h2>
        <div class="tiles">
          <div class="tile"><label>X</label><output id="fx">—</output><small>m</small></div>
          <div class="tile"><label>Y</label><output id="fy">—</output><small>m</small></div>
          <div class="tile"><label>SPEED</label><output id="fv">—</output><small>m/s</small></div>
          <div class="tile"><label>RESID</label><output id="fr">—</output><small>m</small></div>
        </div>
        <div class="kv"><span>Nodes in fix</span><output id="fn">—</output></div>
        <div class="kv"><span>Solver rate</span><output id="frate">—</output></div>
      </section>

      <section class="panel" id="panel-nodes">
        <h2>Nodes</h2>
        <div id="node-cards"></div>
      </section>

      <section class="panel" id="panel-link">
        <h2>Link</h2>
        <div class="row">
          <select id="sel-port"></select>
          <button id="btn-ports" class="ghost" title="Refresh ports">⟳</button>
        </div>
        <div class="row">
          <button id="btn-connect">Connect</button>
          <button id="btn-sim" class="alt">Sim mode</button>
          <button id="btn-record" class="alt">Record</button>
        </div>
        <div class="row">
          <button id="btn-pursuit" class="alt" title="Two-drone interception demo (sim only)">Pursuit demo</button>
        </div>
      </section>

      <section class="panel" id="panel-cal">
        <h2>Calibration</h2>
        <div class="row">
          <select id="cal-node"></select>
          <input id="cal-dist" type="number" value="1.0" step="0.1" min="0.2" title="true distance (m)">
          <input id="cal-secs" type="number" value="15" step="5" min="5" title="capture seconds">
          <button id="btn-cal">Start</button>
        </div>
        <div id="cal-status" class="muted">Hold the powered drone at the given
          distance from the selected node, then press Start.</div>
        <div id="cal-bar"><div></div></div>
      </section>

      <section class="panel" id="panel-cfg">
        <h2>Model</h2>
        <div class="kv"><span>Path-loss n</span>
          <input id="cfg-n" type="number" step="0.1" min="1.5" max="4"></div>
        <div class="kv"><span>Drone alt (m)</span>
          <input id="cfg-z" type="number" step="0.1" min="0"></div>
      </section>
    </aside>
  </main>

  <footer><div id="log" class="mono"></div></footer>
</div>
<script src="app.js"></script>
</body>
</html>
