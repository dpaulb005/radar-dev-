<meta charset="utf-8">
<title>ESP-FLY Drone Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#e8ecf1; --surface:#f8fafc; --surface-2:#eef2f6;
    --ink:#0f151c; --ink-2:#3b4653; --muted:#69757f;
    --rule:#c3ccd6; --hair:#d7dee6;
    --rf:#c2622a; --dsp:#2f77b0; --ok:#22794c; --link:#6a4fbf; --pow:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
      --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
      --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b1015; --surface:#131b23; --surface-2:#18222c;
    --ink:#e6ecf2; --ink-2:#b7c2cc; --muted:#8593a0; --rule:#2c3946; --hair:#222d38;
    --rf:#e59055; --dsp:#6fb0e6; --ok:#5cc48f; --link:#a893ee; --pow:#e0b04a;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5}
  #app{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;height:100vh;min-height:640px}
  header{grid-column:1/3;padding:14px 20px 10px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header h1{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  header .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--link)}
  header .sub{color:var(--ink-2);font-size:13px}
  #vp{position:relative;background:#0a0e13;overflow:hidden}
  #cv{display:block;width:100%;height:100%}
  #hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
  button{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:3px}
  button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.grp{border-radius:0} button.grp:first-child{border-radius:3px 0 0 3px} button.grp:last-child{border-radius:0 3px 3px 0}
  .grpwrap{display:flex}
  #tip{position:absolute;pointer-events:none;background:rgba(15,21,28,.93);color:#e6ecf2;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:5px 8px;border-radius:3px;border:1px solid #3a4a5a;white-space:nowrap;opacity:0;transform:translate(-50%,-130%)}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:1px 5px;border-radius:2px;background:rgba(15,21,28,.78);color:#dfe6ee;border:1px solid rgba(255,255,255,.14);white-space:nowrap;opacity:0;transition:opacity .15s}
  .lbl.rf{color:#f0a878;border-color:rgba(240,168,120,.45)} .lbl.dsp{color:#89c2ea;border-color:rgba(137,194,234,.45)}
  .lbl.ok{color:#7ed6a6;border-color:rgba(126,214,166,.45)} .lbl.pow{color:#f2c86a;border-color:rgba(242,200,106,.45)}
  .lbl.link{color:#c0aef5;border-color:rgba(192,174,245,.45)}
  #status{position:absolute;left:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#8593a0;max-width:70%}
  aside{background:var(--surface);border-left:1px solid var(--rule);overflow-y:auto;padding:12px 14px 30px}
  aside h2{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
  aside h2:first-child{margin-top:2px}
  .row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:12.5px;border:1px solid transparent}
  .row:hover{background:var(--surface-2)} .row.sel{border-color:var(--link);background:var(--surface-2)}
  .row .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px}
  .row .q{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:11px;white-space:nowrap}
  .row small{display:block;color:var(--muted);font-size:11px}
  .total{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);padding:8px 6px;border-top:1px solid var(--rule);margin-top:10px;line-height:1.7}
  .pins{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);padding:4px 6px;border-top:1px solid var(--hair);margin-top:8px}
  .pins b{color:var(--ink);font-weight:500}
  .pins div{display:grid;grid-template-columns:64px 1fr;gap:6px}
  @media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh 1fr} header{grid-column:1} aside{border-left:0;border-top:1px solid var(--rule)}}
</style>

<div id="app">
  <header>
    <div><div class="eyebrow">the target · seeed esp-fly · every part, every pad, every wire</div><h1>ESP-FLY Drone Model</h1></div>
    <div class="sub">Drag to orbit · scroll to zoom · click a row to fly to the part · hover any pad for its GPIO and what it does.</div>
  </header>
  <section id="vp">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="grpwrap"><button class="grp on" data-view="over">Overview</button><button class="grp" data-view="top">Top</button><button class="grp" data-view="under">Underside</button><button class="grp" data-view="rx">Receiver</button></div>
      <button id="b-explode">Exploded</button><button id="b-frame" class="on">Frame</button><button id="b-props" class="on">Props</button><button id="b-labels" class="on">Labels</button><button id="b-spin">Spin</button>
    </div>
    <div id="tip"></div>
    <div id="status"></div>
  </section>
  <aside id="bom"></aside>
</div>

<script>
(function(){
// =====================================================================
// setup — same renderer, lights and palette as radar-bench.html
// =====================================================================
const cv=document.getElementById('cv'), vp=document.getElementById('vp'), tip=document.getElementById('tip');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
function gradientSky(){
  const c=document.createElement('canvas'); c.width=4; c.height=256; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#18232e'); g.addColorStop(0.5,'#0e161d'); g.addColorStop(1,'#070a0e');
  x.fillStyle=g; x.fillRect(0,0,4,256); return new THREE.CanvasTexture(c);
}
scene.background=gradientSky();
// Metal needs something to reflect. A two-stop studio gradient, run through
// PMREM, is enough to make the motor cans chrome and the pads gold instead of
// the flat black that metalness with no environment always gives.
(function(){
  const c=document.createElement('canvas'); c.width=64; c.height=32; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,32);
  g.addColorStop(0,'#eef4fa'); g.addColorStop(0.45,'#8fa2b4'); g.addColorStop(0.55,'#4d5a67'); g.addColorStop(1,'#20272e');
  x.fillStyle=g; x.fillRect(0,0,64,32);
  x.fillStyle='rgba(255,255,255,0.95)'; x.fillRect(6,2,22,7);            // the key light's reflection
  const t=new THREE.CanvasTexture(c); t.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  scene.environment=pm.fromEquirectangular(t).texture; t.dispose(); pm.dispose();
})();
const camera=new THREE.PerspectiveCamera(36,1,0.002,4);
scene.add(new THREE.HemisphereLight(0xaecbe0,0x141b21,0.6));
const key=new THREE.DirectionalLight(0xfff2e2,1.1); key.position.set(0.12,0.26,0.15);
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-0.00025; key.shadow.normalBias=0.0006;
const sc=key.shadow.camera; sc.left=-0.09; sc.right=0.09; sc.top=0.09; sc.bottom=-0.09; sc.near=0.05; sc.far=0.8; sc.updateProjectionMatrix();
scene.add(key);
const fill=new THREE.DirectionalLight(0xbcd4e8,0.32); fill.position.set(-0.2,0.12,0.18); scene.add(fill);
const rim=new THREE.DirectionalLight(0xa893ee,0.4); rim.position.set(-0.15,0.09,-0.25); scene.add(rim);
const under=new THREE.DirectionalLight(0xc8d8e8,0.55); under.position.set(0.10,-0.22,0.08); scene.add(under);   // lights the underside view

const mat=(o)=>new THREE.MeshStandardMaterial(o);
const M={
  pla:mat({color:0xf1f3f5,roughness:.88}),                         // 3D-printed frame, natural white PLA
  plaDark:mat({color:0xdadfe4,roughness:.88}),
  strap:mat({color:0xe8eaec,roughness:.6}),                        // the zip-tie round the pack
  pcbBlack:mat({color:0x15181c,roughness:.62}),
  pcbDark:mat({color:0x1a2026,roughness:.6}),
  pcbGreen:mat({color:0x1f6b48,roughness:.55}),                    // the kit's flight-controller board
  gold:mat({color:0xd4b25a,metalness:.8,roughness:.28}),
  tin:mat({color:0xbfc6cc,metalness:.75,roughness:.32}),
  chrome:mat({color:0xc9ced3,metalness:.9,roughness:.22}),
  steel:mat({color:0x8d959c,metalness:.78,roughness:.30}),
  black:mat({color:0x14181c,roughness:.55}),
  ic:mat({color:0x22262b,roughness:.5}),
  icTop:mat({color:0x2c3136,roughness:.45}),
  can:mat({color:0xb7bec5,metalness:.7,roughness:.35}),
  nylon:mat({color:0xe9e4d3,roughness:.7}),
  lipo:mat({color:0x8f969c,metalness:.35,roughness:.5}),
  lipoLabel:mat({color:0xd9b03a,roughness:.7}),
  shrink:mat({color:0xd9dde2,transparent:true,opacity:.28,roughness:.35,depthWrite:false}),
  propCW:mat({color:0x5a8fd6,transparent:true,opacity:.62,roughness:.4,side:THREE.DoubleSide}),
  propCCW:mat({color:0xd8dde3,transparent:true,opacity:.62,roughness:.4,side:THREE.DoubleSide}),
  ledRed:mat({color:0xd03028,emissive:0x8a1008,emissiveIntensity:.8,roughness:.4}),
  ledBlue:mat({color:0x3070d0,emissive:0x0a3a8a,emissiveIntensity:.8,roughness:.4}),
  ledGreen:mat({color:0x30c060,emissive:0x0a6a2a,emissiveIntensity:.8,roughness:.4}),
  fpc:mat({color:0xc98a3a,roughness:.5,side:THREE.DoubleSide}),
  glow:mat({color:0xffc06a,emissive:0xff9a2a,emissiveIntensity:.9,transparent:true,opacity:.9}),
};
const WC={black:0x1a1a1a,red:0xc0392b,blue:0x2e86de,white:0xe8e8e8,yellow:0xd8c02a,green:0x2ecc71,grey:0x8a949c};
const wireMat={}; for(const k in WC) wireMat[k]=mat({color:WC[k],roughness:.7});

// =====================================================================
// the numbers — from Seeed's kit page, the Elektor build article and the
// esp-fc guide. verify_drone.py reads these constants back.
// =====================================================================
const BODY=0.046;          // closed-body frame footprint, without props
const OVERALL=0.067;       // tip to tip across the props
const H_NOPROP=0.029, H_PROP=0.031;
const PROP_D=0.030, PROP_BLADES=3, SHAFT_D=0.0008;     // GEMFAN tri-blade, 0.8 mm shaft
const MOTOR_PITCH=(OVERALL-PROP_D);                     // 37 mm: props do not overlap
const MOTOR_D=0.006, MOTOR_L=0.015;                     // 615 coreless: 6 mm can, 15 mm long
const XIAO_L=0.021, XIAO_W=0.0178, XIAO_T=0.0012, XIAO_PITCH=0.00254, XIAO_ROWGAP=0.01524;
const FC_W=0.022, FC_D=0.022, FC_T=0.0016;               // the green board the XIAO plugs into
const POD_OD=0.0085, POD_ID=0.0062, POD_H=0.011;        // corner motor pod: the 6 mm can press-fits
const RING_W=0.0042, RING_H=0.0032;                     // the bumper ring joining the four pods
const ARM_W=0.0030, ARM_T=0.0024;                       // each arm is two prongs, not one bar
const HUB=0.024;                                        // the centre plate the canopy stands on
const CAN_W=0.0240, CAN_H=0.0125, COVER_W=0.0220, COVER_T=0.0012;   // canopy and its ESP FLY cover
const LEG_R=0.00045;                                    // landing legs: 0.9 mm solid-core wire, bent
const RX_L=0.019, RX_W=0.012, RX_T=0.0008;              // BetaFPV ELRS Nano 915
const ANT_LEN=0.080;                                    // 915 MHz quarter-wave, drone-link.md 4
const BAT=[0.033,0.008,0.020];                          // 1S 250 mAh LiPo, JST-PH
// mass roll-up, grams. Kit: 4 g frame, 1 g FC module, 18 g without / 25 g with LiPo.
const MASS={frame:4.0,fc:1.0,xiao:3.0,motor:2.1,prop:0.35,lipo:7.0,rx:0.7,ant:0.3,wiring:0.4};
const KIT_MASS_NO_LIPO=18.0, KIT_MASS=25.0;

// esp-fc pin map for the ESP-FLY (Elektor esp-fc guide; drone-link-espfc.md)
const XIAO_LEFT=[['D0','GPIO1','motor 4 — front-left'],['D1','GPIO2','battery voltage (ADC)'],
  ['D2','GPIO3','motor 3 — rear-left'],['D3','GPIO4','motor 1 — rear-right'],
  ['D4','GPIO5','I2C SDA → MPU-6050'],['D5','GPIO6','I2C SCL → MPU-6050'],['D6','GPIO43','status LED']];
const XIAO_RIGHT=[['5V','VBUS','USB only — no 5 V rail in flight'],['GND','GND','ground'],['3V3','3V3','3.3 V out → receiver'],
  ['D10','GPIO9','UART2 RX ← receiver TX (CRSF)'],['D9','GPIO8','UART2 TX → receiver RX (telemetry)'],
  ['D8','GPIO7','motor 2 — front-right'],['D7','GPIO44','spare (UART0 RX)']];
// motor order, position, direction: esp-fc keeps Betaflight order, props-in
const MOTORS=[['M1','rear-right', 1, 1,'CW', 'GPIO4', 'D3'],['M2','front-right',1,-1,'CCW','GPIO7','D8'],
              ['M3','rear-left', -1, 1,'CCW','GPIO3','D2'],['M4','front-left', -1,-1,'CW', 'GPIO1','D0']];

// =====================================================================
// helpers
// =====================================================================
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function box(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); }
function cyl(r,h,m,seg=18){ return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); }
function tube(r1,r2,h,m,seg=24){ const g=new THREE.CylinderGeometry(r1,r1,h,seg,1,true); return new THREE.Mesh(g,m); }
function ring(rOut,rIn,h,m,seg=28){
  const s=new THREE.Shape(); s.absarc(0,0,rOut,0,Math.PI*2,false);
  const hole=new THREE.Path(); hole.absarc(0,0,rIn,0,Math.PI*2,true); s.holes.push(hole);
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:seg}); g.rotateX(-Math.PI/2);
  return new THREE.Mesh(g,m); }
function at(m,x,y,z){ m.position.set(x,y,z); return m; }
function strut(a,b,r,m,seg=8){ const d=new THREE.Vector3().subVectors(b,a); const s=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),seg),m);
  s.position.copy(a).add(b).multiplyScalar(.5); s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize()); return s; }
function roundedPlate(w,d,t,r,m){
  const s=new THREE.Shape(); const x=-w/2,y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+d-r);
  s.quadraticCurveTo(x+w,y+d,x+w-r,y+d); s.lineTo(x+r,y+d); s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false,curveSegments:6}); g.rotateX(-Math.PI/2);
  return new THREE.Mesh(g,m); }

const pickables=[], labels=[], registry={};
function reg(id,obj,name,cls){ obj.userData.bom=id; obj.userData.name=name||id; if(cls) obj.userData.cls=cls;
  (registry[id]=registry[id]||[]).push(obj);
  obj.traverse(o=>{ if(o.isMesh){ if(o.userData.pinName===undefined && !o.userData.name) o.userData.name=obj.userData.name;
    o.userData.bom=id; if(!o.userData._pick){o.userData._pick=1; pickables.push(o);} } });
  return obj; }
function addLabel(obj,text,cls,off,major){ const el=document.createElement('div'); el.className='lbl '+(cls||''); el.textContent=text;
  vp.appendChild(el); labels.push({el,obj,off:off||new THREE.Vector3(0,.004,0),major:!!major}); }

// cable routing: straight runs with a fillet at every bend (as radar-bench.html)
function cablePath(pts,bend){
  const p=[]; pts.forEach(v=>{ if(!p.length || p[p.length-1].distanceTo(v)>1e-6) p.push(v.clone()); });
  if(p.length<2) return null;
  const path=new THREE.CurvePath(); let prev=p[0];
  for(let i=1;i<p.length-1;i++){
    const c=p[i], nx=p[i+1];
    const din=new THREE.Vector3().subVectors(c,prev), dout=new THREE.Vector3().subVectors(nx,c);
    const lin=din.length(), lout=dout.length(); if(lin<1e-7||lout<1e-7) continue;
    din.divideScalar(lin); dout.divideScalar(lout);
    if(din.dot(dout)>0.9995) continue;
    const rr=Math.min(bend===undefined?0.0015:bend, lin*0.5, lout*0.5);
    const a=c.clone().addScaledVector(din,-rr), b=c.clone().addScaledVector(dout,rr);
    if(prev.distanceTo(a)>1e-6) path.add(new THREE.LineCurve3(prev.clone(),a));
    path.add(new THREE.QuadraticBezierCurve3(a,c.clone(),b)); prev=b; }
  const last=p[p.length-1]; if(prev.distanceTo(last)>1e-6) path.add(new THREE.LineCurve3(prev.clone(),last.clone()));
  return path.curves.length?path:null; }
const wires=[];
function wire(name,pts,r,m,ends,bend){
  const c=cablePath(pts,bend); if(!c) return new THREE.Object3D();
  const len=c.getLength(), n=Math.max(16,Math.min(220,Math.round(len/0.0006)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,n,r,8,false),m);
  mesh.userData.curve=c; mesh.userData.polyline=pts; mesh.userData.name=name; mesh.userData.isWire=true; mesh.userData.ends=ends||[];
  mesh.userData.len=len; mesh.castShadow=true; wires.push(mesh); return mesh; }
// named pads: hovering one names the net; every wire lands ON one of these
function addPin(parent,name,x,y,z,mesh,dir,desc){ mesh.position.set(x,y,z); mesh.userData.pinName=name;
  mesh.userData.name=desc||name; if(dir) mesh.userData.pinDir=dir; parent.add(mesh);
  (parent.userData.pins=parent.userData.pins||{})[name]=mesh; return mesh; }
function P(comp,name){ const p=comp.userData.pins[name]; if(!p) throw new Error('no pad '+name+' on '+(comp.userData.name||'?'));
  p.updateWorldMatrix(true,false);            // pads are read as they are built; never trust a stale matrix
  const d=(p.userData.pinDir||new THREE.Vector3(0,1,0)).clone(); const o=p.localToWorld(new THREE.Vector3(0,0,0));
  return {pos:p.localToWorld(new THREE.Vector3(0,p.userData.pinTop||0,0)), dir:p.localToWorld(d).sub(o).normalize(), comp, pin:name}; }
function pad(parent,name,x,y,z,w,d,desc){ const p=box(w,0.00015,d,M.gold); p.userData.pinTop=0.0001; return addPin(parent,name,x,y,z,p,V(0,1,0),desc); }

// =====================================================================
// the drone. +y up, nose is -z, right is +x. Ground = the battery's underside.
// =====================================================================
const drone=new THREE.Group(); scene.add(drone);
const parts={};                                     // sub-groups that the exploded view lifts
function part(id){ const g=new THREE.Group(); g.userData.explode=new THREE.Vector3(); drone.add(g); parts[id]=g; return g; }

// ---- levels ---------------------------------------------------------------
// y = 0 is the ground the legs stand on. The kit's two heights fall straight
// out of the stack: 29 mm to the top of a motor, 31 mm to the blade plane.
const Y_BAT0=0.0025, Y_PLATE=Y_BAT0+BAT[1];          // the pack hangs under the centre plate
const PLATE_T=0.0015, Y_PLATE_TOP=Y_PLATE+PLATE_T;   // 12.0
const Y_POD0=Y_PLATE, Y_POD_TOP=Y_PLATE_TOP+POD_H;   // pods stand off the plate, 23.0 at the top
const Y_MOTOR0=Y_PLATE_TOP+0.002, Y_MOTOR1=Y_MOTOR0+MOTOR_L;      // 14.0 -> 29.0 = H_NOPROP
const Y_PROP=Y_MOTOR1+0.0015;                        // blade plane 30.5, tips at 31 = H_PROP
const Y_FC=Y_PLATE_TOP+0.0025, Y_FC_TOP=Y_FC+FC_T;   // the FC on 2.5 mm standoffs
const HDR=0.0034;                                    // the XIAO stands on its header pins
const Y_XIAO=Y_FC_TOP+HDR, Y_XIAO_TOP=Y_XIAO+XIAO_T;
const Y_DECK=Y_PLATE_TOP+CAN_H, DECK_T=COVER_T, Y_DECK_TOP=Y_DECK+DECK_T;   // the cover, 25.7
const MP=MOTOR_PITCH/2;                              // 18.5 mm

// ---- the airframe, as printed: an X. A small centre plate carries the
// canopy; four two-prong arms fan out to the corner motor pods; a bumper ring
// joins the pods; four bent-wire legs hang under the corners. Nothing about it
// is a box — the 46 mm across the kit quotes is pod edge to pod edge.
const frame=part('frame');
const R_BODY=0.004;
function extrudeDown(shape,depth,m,seg){ const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:seg||8});
  g.rotateX(Math.PI/2); return new THREE.Mesh(g,m); }
function rrect(path,w,d,r,cx,cy){ const x=(cx||0)-w/2,y=(cy||0)-d/2;
  path.moveTo(x+r,y); path.lineTo(x+w-r,y); path.quadraticCurveTo(x+w,y,x+w,y+r); path.lineTo(x+w,y+d-r);
  path.quadraticCurveTo(x+w,y+d,x+w-r,y+d); path.lineTo(x+r,y+d); path.quadraticCurveTo(x,y+d,x,y+d-r);
  path.lineTo(x,y+r); path.quadraticCurveTo(x,y,x+r,y); return path; }
// a flat bar between two points in plan, w wide and t thick, lying at height y
function plank(ax,az,bx,bz,w,t,y,m){ const dx=bx-ax, dz=bz-az, L=Math.hypot(dx,dz);
  const b=box(w,t,L,m); b.position.set((ax+bx)/2,y+t/2,(az+bz)/2); b.rotation.y=Math.atan2(dx,dz); return b; }
// a formed wire — the landing legs. Same fillet routing as the cabling, but it
// is a structural part, so it is not registered as a wire for the self-test.
function formed(pts,r,m,bend){ const c=cablePath(pts,bend===undefined?0.0018:bend);
  const n=Math.max(24,Math.min(160,Math.round(c.getLength()/0.0004)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,n,r,8,false),m); mesh.castShadow=true; return mesh; }

const plate=roundedPlate(HUB,HUB,PLATE_T,0.0035,M.pla); plate.position.y=Y_PLATE; frame.add(plate);
plate.userData.name='frame — centre plate, 24 × 24 × 1.5 mm; the pack straps under it';

// four arms, each a two-prong fork from the plate's edges to its pod
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
  [[sx*(HUB/2-0.0012),sz*0.0038],[sx*0.0038,sz*(HUB/2-0.0012)]].forEach(([ax,az],k)=>{
    const arm=plank(ax,az,sx*MP,sz*MP,ARM_W,ARM_T,Y_PLATE_TOP-0.0002,M.pla); frame.add(arm);
    arm.userData.name='frame — arm prong '+(k?'b':'a')+', hub to the '+(sz<0?'front':'rear')+'-'+(sx<0?'left':'right')+' pod'; });
});
// the bumper ring: four bars pod to pod, at the bottom of the pods

[[-1,'front'],[1,'rear']].forEach(([sz,end])=>{
  const r=plank(-MP,sz*MP,MP,sz*MP,RING_W,RING_H,Y_PLATE,M.pla); frame.add(r); r.userData.name='frame — '+end+' bumper rail'; });
// motor pods and their landing legs
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
  const pod=ring(POD_OD/2,POD_ID/2,POD_H+PLATE_T,M.pla); pod.position.set(sx*MP,Y_POD0,sz*MP); frame.add(pod);
  pod.userData.name='frame — motor pod, 6.2 mm bore; the can press-fits, a spot of glue holds it';
  const lip=ring(POD_OD/2+0.0003,POD_OD/2-0.0004,0.0012,M.pla); lip.position.set(sx*MP,Y_POD_TOP-0.0012,sz*MP); frame.add(lip);
  lip.userData.name='frame — pod lip';
  // leg: 25 mm of solid-core wire bent into a V, both ends into the pod base
  const dx=sx/Math.SQRT2, dz=sz/Math.SQRT2, tx=-dz, tz=dx, px=sx*MP, pz=sz*MP;
  const e=(k)=>V(px+tx*k*0.0032+dx*0.0018, Y_PLATE+0.0016, pz+tz*k*0.0032+dz*0.0018);
  const leg=formed([e(1),
                    V(px+tx*0.0030+dx*0.0030, Y_PLATE-0.0032, pz+tz*0.0030+dz*0.0030),
                    V(px+tx*0.0014+dx*0.0038, 0.0002, pz+tz*0.0014+dz*0.0038),

                    e(-1)],LEG_R,M.black,0.0022);
  leg.userData.name='landing leg — 25 mm solid-core jumper wire bent into a V';
  frame.add(leg);
});

function shell(h,y,gapFront,gapRear){
  const g=new THREE.Group();
  const t=0.0013, W=CAN_W;

  [['nose',-1,gapFront],['tail',1,gapRear]].forEach(([n,sz,gap])=>{

  });

}

// one blade: tapered planform from the hub (r 2 mm) to the tip (r 15 mm), 0.5 mm thick, pitched about its radial axis
function bladeGeom(){ const s=new THREE.Shape();
  s.moveTo(0.0020,-0.0014);
  s.splineThru([V(0.0050,-0.0023),V(0.0095,-0.0021),V(0.0130,-0.0012),V(0.0148,-0.0004),V(0.0150,0),V(0.0148,0.0004),V(0.0130,0.0012),V(0.0095,0.0021),V(0.0050,0.0023),V(0.0020,0.0014)].map(v=>new THREE.Vector2(v.x,v.y)));
  s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:0.0005,bevelEnabled:false,curveSegments:12}); g.rotateX(Math.PI/2); g.translate(0,0.00025,0);
  g.computeBoundingBox(); return g; }
const motors=part('motors'); const props=part('props'); props.userData.explode.set(0,0.020,0);
const motorObjs={};
MOTORS.forEach(([id,pos,sx,sz,dir,gpio,d])=>{
  const g=new THREE.Group(); g.position.set(sx*MP,0,sz*MP); motors.add(g); motorObjs[id]=g;
  const canM=cyl(MOTOR_D/2,MOTOR_L-0.002,M.chrome,20); canM.position.y=Y_MOTOR0+MOTOR_L/2; g.add(canM);
  canM.userData.name=id+' · 615 coreless motor, 6 × 15 mm, ~2 g, 70 000 rpm, '+pos+' — '+dir+' from '+gpio+' ('+d+')';
  const capT=cyl(MOTOR_D/2,0.001,M.black,20); capT.position.y=Y_MOTOR1-0.0005; g.add(capT);
  const capB=cyl(MOTOR_D/2,0.001,M.black,20); capB.position.y=Y_MOTOR0+0.0005; g.add(capB);
  const shaft=cyl(SHAFT_D/2,0.0030,M.steel,8); shaft.position.y=Y_MOTOR1+0.0015; g.add(shaft); shaft.userData.name='0.8 mm shaft';
  // lead terminals at the bottom cap, on the side facing the centre
  const wc=dir==='CW'?['red','blue']:['black','white'];
  [['A',0.0009,wc[0]],['B',-0.0009,wc[1]]].forEach(([n,off,col])=>{
    const t=box(0.0006,0.0006,0.0006,M.tin);
    // terminal on the inboard face of the can, just above the bottom cap
    const ix=-sx*(MOTOR_D/2), iz=-sz*(MOTOR_D/2);
    addPin(g,n,ix*0.8+(-sz)*off,Y_MOTOR0+0.0012,iz*0.8+(sx)*off,t,V(-sx,0,-sz).normalize(),id+' terminal '+n+' ('+col+' lead)'); });
  reg('K3',g,id+' — 615 coreless motor, '+pos,'link');
  addLabel(g,id+' · '+pos+' · '+dir,'link',V(0,Y_MOTOR1+0.006,0));
  // prop: hub + three blades, colour by direction
  const p=new THREE.Group(); p.position.set(sx*MP,Y_PROP,sz*MP); props.add(p); p.userData.dir=dir;

  const v=views[k]; if(snap){ tgt.copy(v.t); dist=v.d; az=v.a; el=v.e; goal=null; place(); } else flyTo(v.t,v.d,v.a,v.e); }

let drag=false,px=0,py=0,moved=false;
cv.addEventListener('pointerdown',e=>{drag=true;moved=false;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=false; if(!moved) pick(e,true);});
cv.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-px, dy=e.clientY-py;
    if(Math.abs(dx)+Math.abs(dy)>2) moved=true; az-=dx*0.008; el=Math.max(-1.2,Math.min(1.5,el+dy*0.006));
    px=e.clientX;py=e.clientY; goal=null; place(); } else pick(e,false); });
cv.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.max(0.02,Math.min(1.2,dist*(e.deltaY>0?1.12:0.89))); goal=null; place();},{passive:false});
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e,click){ const r=cv.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1; ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(isShown),false);
  if(hits.length){ const o=hits[0].object; tip.textContent=o.userData.name||'';
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.style.opacity=1; cv.style.cursor='pointer';
    if(click){ const id=o.userData.bom; const row=document.querySelector(`.row[data-id="${id}"]`); if(row) row.scrollIntoView({block:'nearest'}); selectBom(id,row); } }
  else { tip.style.opacity=0; cv.style.cursor='grab'; } }
function resize(){ const w=vp.clientWidth,h=vp.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); place(); }
window.addEventListener('resize',resize);

const v3=new THREE.Vector3(); const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches; let t0=performance.now();
function frame_(now){ const dt=Math.min((now-t0)/1000,0.05); t0=now;
  if(goal){ const k=1-Math.pow(0.001,dt); tgt.lerp(goal.t,k); dist+=(goal.d-dist)*k; az+=(goal.a-az)*k; el+=(goal.e-el)*k;
    if(Math.abs(dist-goal.d)<1e-4 && tgt.distanceTo(goal.t)<1e-4) goal=null; place(); }
  explodeK+=((exploded?1:0)-explodeK)*(1-Math.pow(0.002,dt));
  for(const k in parts){ const g=parts[k]; g.position.copy(g.userData.explode).multiplyScalar(explodeK); }
  if(spin && !reduced){ drone.rotation.y+=dt*0.5; props.children.forEach(p=>p.rotation.y+=(p.userData.dir==='CW'?-1:1)*dt*22); }
  if(highlight.length){ M.glow.emissiveIntensity=0.5+0.5*Math.abs(Math.sin((now-hlT)/250));
    if(now-hlT>4000){ highlight.forEach(o=>o.material=o.userData.origMat); highlight=[]; } }
  renderer.render(scene,camera);
  const w=vp.clientWidth,h=vp.clientHeight, closeView=dist<0.09;
  labels.forEach(L=>{ const vis=showLabels && isShown(L.obj) && (closeView || L.major);
    if(!vis){L.el.style.opacity=0;return;}
    L.obj.getWorldPosition(v3); v3.add(L.off); v3.project(camera);
    if(v3.z>1){L.el.style.opacity=0;return;}
    L.el.style.left=((v3.x*0.5+0.5)*w)+'px'; L.el.style.top=((-v3.y*0.5+0.5)*h)+'px'; L.el.style.opacity=1; });
  requestAnimationFrame(frame_);
}

// =====================================================================
// self-test over the real scene graph. Reported in the title for verify_drone.py.
// =====================================================================
function selfTest(){
  const problems=[];
  drone.updateMatrixWorld(true);
  // 1. props cannot overlap
  if(MOTOR_PITCH<=PROP_D) problems.push('prop overlap: pitch '+MOTOR_PITCH+' <= diameter '+PROP_D);
  // 2. the envelope is the kit's: 67 x 67 across the props, ~31 tall with them.
  //    Blade phase makes a bounding box meaningless, so use hub-to-tip radius;
  //    and the antenna tail leaves the envelope on purpose, so box it without.
  const tipR=Math.max(...props.children[0].children.filter(o=>o.isGroup).map(piv=>{ const bl=piv.children[0];
    bl.geometry.computeBoundingBox(); return Math.abs(bl.position.x)+bl.geometry.boundingBox.max.x; }));
  if(Math.abs(2*tipR-PROP_D)>PROP_D*0.03) problems.push('prop diameter '+(2*tipR*1e3).toFixed(1)+' mm, want '+(PROP_D*1e3));
  if(Math.abs(MOTOR_PITCH+2*tipR-OVERALL)>OVERALL*0.05) problems.push('envelope across props '+((MOTOR_PITCH+2*tipR)*1e3).toFixed(1)+' mm, kit says '+(OVERALL*1e3));
  const fb=new THREE.Box3().setFromObject(frame), fs=fb.getSize(new THREE.Vector3());
  if(Math.abs(fs.x-BODY)>0.0015||Math.abs(fs.z-BODY)>0.0015) problems.push('body '+(fs.x*1e3).toFixed(1)+' x '+(fs.z*1e3).toFixed(1)+' mm, kit says '+(BODY*1e3));
  const bb2=new THREE.Box3(); drone.traverse(o=>{ if(o.isMesh){ let p=o, inAnt=false; while(p){ if(p===ant) inAnt=true; p=p.parent; }
    if(!inAnt) bb2.expandByObject(o); } }); const s2=bb2.getSize(new THREE.Vector3());
  if(Math.abs(s2.y-H_PROP)>H_PROP*0.15) problems.push('height with props '+(s2.y*1e3).toFixed(1)+' mm, kit says '+(H_PROP*1e3));
  // 3. the antenna never enters a prop disk (with 2 mm to spare) and is the stated length
  const discs=MOTORS.map(([id,pos,sx,sz])=>({id,x:sx*MP,z:sz*MP}));
  const aw=wires.find(w=>w.userData.isAntenna);
  const apts=aw.userData.curve.getSpacedPoints(120);
  apts.forEach(p=>{ discs.forEach(d=>{ const r=Math.hypot(p.x-d.x,p.z-d.z);
    if(r<PROP_D/2+0.002 && p.y>Y_MOTOR1-0.002 && p.y<Y_PROP+0.004) problems.push('antenna inside prop disc '+d.id+' at r='+(r*1e3).toFixed(1)+' mm'); }); });
  if(Math.abs(aw.userData.len-ANT_LEN)>ANT_LEN*0.10) problems.push('antenna length '+(aw.userData.len*1e3).toFixed(0)+' mm, want '+(ANT_LEN*1e3));
  // 4. every wire starts and ends within 1.2 mm of a named pad on the parts it claims
  wires.forEach(w=>{ if(w.userData.isAntenna) return; const pl=w.userData.polyline, ends=[pl[0],pl[pl.length-1]];
    ends.forEach((e,i)=>{ if(i===1 && (w.userData.name.indexOf('pigtail')>=0)) return;
      if(i===0 && w.userData.isBatteryLead) return;              // starts inside the pack's own tab, not on a pad
      let best=1; (w.userData.ends||[]).forEach(comp=>{ const pins=comp.userData.pins||{}; for(const k in pins){ const q=pins[k].getWorldPosition(new THREE.Vector3()); best=Math.min(best,q.distanceTo(e)); } });
      if(best>0.0012) problems.push('wire end '+(i?'B':'A')+' is '+(best*1e3).toFixed(1)+' mm from any pad: '+w.userData.name); }); });
  // 5. no lead passes through a motor can, the battery or the module shield
  const obst=[]; MOTORS.forEach(([id])=>obst.push([id+' motor',motorObjs[id].children[0]])); obst.push(['LiPo',cell],['ESP32-S3 shield',can]);
  const boxes=obst.map(([n,o])=>({n,box:new THREE.Box3().setFromObject(o).expandByScalar(-0.0003)}));
  wires.forEach(w=>{ const pts=w.userData.curve.getSpacedPoints(80);
    boxes.forEach(b=>{ for(const p of pts){ if(b.box.containsPoint(p)){ problems.push('wire through '+b.n+': '+w.userData.name); break; } } }); });
  // 6. the receiver is wired to the pins the docs say, and the mass adds up to the kit's
  const names=wires.map(w=>w.userData.name).join(' | ');
  if(names.indexOf('receiver TX → FC RX')<0 || names.indexOf('GPIO9')<0) problems.push('receiver TX is not wired to the FC RX pad (GPIO9)');
  if(names.indexOf('receiver RX → FC TX')<0 || names.indexOf('GPIO8')<0) problems.push('receiver RX is not wired to the FC TX pad (GPIO8)');
  if(Math.abs(mKit-KIT_MASS)>KIT_MASS*0.10) problems.push('mass roll-up '+mKit.toFixed(1)+' g vs kit '+KIT_MASS);
  return problems;
}
try{ const pr=selfTest(); document.title=pr.length?('GEOM FAIL '+pr.join(' ; ')):'GEOM OK'; window.__geom=pr; }
catch(e){ document.title='GEOM FAIL exception: '+e.message; }
if(document.title==='GEOM OK') status.textContent='ESP-FLY · X-frame, pods at 37 mm · 25 g take-off + 1 g of 915 MHz link · antenna clear of every disc';
resize(); requestAnimationFrame(frame_);
})();
</script>
